[package]
name = "saki-mcp-tool-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
