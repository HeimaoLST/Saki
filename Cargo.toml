[package]
name = "Saki"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
anyhow = "1.0.104"
sha2 = "0.10"
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-async-rw"] }
jsonschema = { version = "=0.59.0", default-features = false }
dotenvy = "0.15.7"
futures-util = "0.3"
libc = "0.2"
eventsource-stream = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
