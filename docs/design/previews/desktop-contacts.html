<div id="saki-desktop-contacts" aria-label="Saki desktop contacts">
  <style>
    /* Rose Pine (dark) / Rosé Pine Dawn (light) — https://rosepinetheme.com/palette/ */
    #saki-desktop-contacts {
      color-scheme: light dark;
      --base: light-dark(#faf4ed, #191724);
      --surface: light-dark(#fffaf3, #1f1d2e);
      --overlay: light-dark(#f2e9e1, #26233a);
      --text: light-dark(#575279, #e0def4);
      --subtle: light-dark(#6e6a86, #908caa); /* Dawn secondary slightly darkened for 12px readability */
      --link: light-dark(#286983, #9ccfd8); /* Dawn pine / Main foam: readable links and sources */
      --rose: light-dark(#d7827e, #ebbcba);
      --pine: light-dark(#286983, #31748f);
      --foam: light-dark(#56949f, #9ccfd8);
      --gold: light-dark(#ea9d34, #f6c177);
      --love: light-dark(#b4637a, #eb6f92);
      --iris: light-dark(#907aa9, #c4a7e7);
      --highlight: light-dark(#dfdad9, #403d52);
      --rule: var(--highlight);
      --rule-soft: light-dark(#f2e9e1, #26233a);
      --on-action: #191724;
      --select-tint: light-dark(rgba(215, 130, 126, 0.14), rgba(235, 188, 186, 0.12));
      --iris-tint: light-dark(rgba(144, 122, 169, 0.16), rgba(196, 167, 231, 0.16));
      --gold-tint: light-dark(rgba(234, 157, 52, 0.14), rgba(246, 193, 119, 0.12));
      --rail: 220px;
      --gap: 18px;
      --reading: 620px;
      --shadow: 0 10px 30px light-dark(rgba(87, 82, 121, 0.10), rgba(0, 0, 0, 0.35));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
      -webkit-font-smoothing: antialiased;
    }
    #saki-desktop-contacts *,
    #saki-desktop-contacts *::before,
    #saki-desktop-contacts *::after { box-sizing: border-box; }
    #saki-desktop-contacts [hidden] { display: none !important; }
    #saki-desktop-contacts p,
    #saki-desktop-contacts h1,
    #saki-desktop-contacts h2,
    #saki-desktop-contacts h3,
    #saki-desktop-contacts ul,
    #saki-desktop-contacts ol,
    #saki-desktop-contacts dl,
    #saki-desktop-contacts dt,
    #saki-desktop-contacts dd { margin: 0; }
    #saki-desktop-contacts ul,
    #saki-desktop-contacts ol { padding: 0; list-style: none; }
    #saki-desktop-contacts button,
    #saki-desktop-contacts input,
    #saki-desktop-contacts textarea {
      font: inherit;
      color: inherit;
      letter-spacing: inherit;
    }
    #saki-desktop-contacts [data-lucide] {
      display: inline-block;
      width: 16px;
      height: 16px;
      flex: none;
    }
    #saki-desktop-contacts svg.lucide { width: 16px; height: 16px; flex: none; }
    #saki-desktop-contacts :focus-visible {
      outline: 2px solid var(--iris);
      outline-offset: 2px;
      border-radius: 4px;
    }
    #saki-desktop-contacts .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- app shell ---------- */
    #saki-desktop-contacts .app {
      display: grid;
      grid-template-columns: min(var(--rail), 280px) minmax(0, 1fr);
      min-height: 600px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 12px;
      overflow: clip;
      box-shadow: var(--shadow);
    }
    #saki-desktop-contacts .app.has-aux {
      grid-template-columns: min(var(--rail), 280px) minmax(0, 1fr) min(300px, 30vw);
    }

    /* ---------- rail ---------- */
    #saki-desktop-contacts .rail {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 14px 10px 12px;
      background: var(--base);
      border-right: 1px solid var(--rule-soft);
    }
    #saki-desktop-contacts .rail-app {
      padding: 0 8px 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    #saki-desktop-contacts .rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px 8px;
    }
    #saki-desktop-contacts .rail-head h2 {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--subtle);
    }
    #saki-desktop-contacts .rail-toggle {
      display: none;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      margin-bottom: 6px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      text-align: left;
    }
    #saki-desktop-contacts .rail-toggle-label {
      font-size: 12px;
      color: var(--subtle);
    }
    #saki-desktop-contacts .rail-toggle-name {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #saki-desktop-contacts .rail-toggle svg.lucide,
    #saki-desktop-contacts .rail-toggle [data-lucide] { color: var(--subtle); }
    #saki-desktop-contacts .rail-toggle[aria-expanded="true"] svg.lucide,
    #saki-desktop-contacts .rail-toggle[aria-expanded="true"] [data-lucide] { transform: rotate(180deg); }
    #saki-desktop-contacts .contact-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    #saki-desktop-contacts .contact-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 9px 8px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      text-align: left;
    }
    #saki-desktop-contacts .contact-row:hover { background: var(--overlay); }
    #saki-desktop-contacts .contact-row.is-selected {
      background: var(--select-tint);
      border-color: transparent;
      box-shadow: inset 2px 0 0 var(--rose);
    }
    #saki-desktop-contacts .contact-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    #saki-desktop-contacts .contact-top {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }
    #saki-desktop-contacts .contact-name {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #saki-desktop-contacts .contact-row.is-selected .contact-name { font-weight: 600; }
    #saki-desktop-contacts .unread-badge {
      flex: none;
      min-width: 17px;
      height: 17px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--rose);
      color: var(--on-action);
      font-size: 11px;
      font-weight: 600;
      line-height: 17px;
      text-align: center;
    }
    #saki-desktop-contacts .contact-snippet {
      font-size: 12px;
      color: var(--subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #saki-desktop-contacts .contact-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--subtle);
    }
    #saki-desktop-contacts .contact-status.status-working { color: var(--link); }
    #saki-desktop-contacts .contact-status.status-attention { color: var(--text); }
    #saki-desktop-contacts .rail-foot {
      margin-top: auto;
      padding: 14px 8px 2px;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--subtle);
    }

    /* ---------- avatar / status dot ---------- */
    #saki-desktop-contacts .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 2px;
      flex: none;
      border-radius: 8px;
      background: var(--overlay);
    }
    #saki-desktop-contacts .avatar-lg {
      width: 36px;
      height: 36px;
      padding: 3px;
      border-radius: 10px;
    }
    #saki-desktop-contacts .avatar-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #saki-desktop-contacts .status-dot {
      width: 7px;
      height: 7px;
      flex: none;
      border-radius: 50%;
      background: var(--subtle);
    }
    #saki-desktop-contacts .status-ready .status-dot { background: var(--pine); }
    #saki-desktop-contacts .status-working .status-dot {
      background: var(--pine);
      animation: saki-pulse 1.4s ease-in-out infinite;
    }
    #saki-desktop-contacts .status-attention .status-dot { background: var(--gold); }
    @keyframes saki-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ---------- main column + chat header ---------- */
    #saki-desktop-contacts .main-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--surface);
    }
    #saki-desktop-contacts .chat-head {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 13px 18px;
      border-bottom: 1px solid var(--rule-soft);
    }
    #saki-desktop-contacts .chat-who {
      display: flex;
      align-items: center;
      gap: 11px;
      flex: 1;
      min-width: 180px;
    }
    #saki-desktop-contacts .chat-who-text { min-width: 0; }
    #saki-desktop-contacts .chat-name {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #saki-desktop-contacts .chat-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
      font-size: 12px;
      color: var(--subtle);
    }
    #saki-desktop-contacts .chat-meta.status-working { color: var(--link); }
    #saki-desktop-contacts .chat-meta.status-attention { color: var(--text); }
    #saki-desktop-contacts .chat-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
      margin-left: auto;
    }
    #saki-desktop-contacts .flash {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--link);
    }

    /* ---------- shared actions ---------- */
    #saki-desktop-contacts .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 32px;
      padding: 5px 11px;
      background: var(--overlay);
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }
    #saki-desktop-contacts .action:hover { border-color: var(--link); color: var(--link); }
    #saki-desktop-contacts .action:disabled { opacity: 0.5; }
    #saki-desktop-contacts .action-primary {
      background: var(--rose);
      color: var(--on-action);
      border-color: transparent;
    }
    #saki-desktop-contacts .action-primary:hover {
      background: var(--rose);
      color: var(--on-action);
      filter: brightness(1.06);
    }
    #saki-desktop-contacts .action-quiet {
      background: transparent;
      color: var(--subtle);
    }
    #saki-desktop-contacts .action-quiet:hover { background: var(--overlay); color: var(--link); }
    #saki-desktop-contacts .icon-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      flex: none;
      padding: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--subtle);
    }
    #saki-desktop-contacts .icon-action:hover { background: var(--overlay); color: var(--link); }

    /* ---------- transcript ---------- */
    #saki-desktop-contacts .chat-scroll { flex: 1 1 auto; }
    #saki-desktop-contacts .chat-body {
      width: 100%;
      max-width: calc(var(--reading) + 56px);
      margin: 0 auto;
      padding: 22px 20px 6px;
    }
    #saki-desktop-contacts .earlier {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      margin-bottom: var(--gap);
      padding-bottom: var(--gap);
      border-bottom: 1px solid var(--rule-soft);
    }
    #saki-desktop-contacts .earlier-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--link);
    }
    #saki-desktop-contacts .transcript {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      min-width: 0;
    }
    #saki-desktop-contacts .msg {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    #saki-desktop-contacts .msg-user {
      display: flex;
      justify-content: flex-end;
    }
    #saki-desktop-contacts .msg-user .bubble {
      max-width: min(82%, 460px);
      padding: 9px 13px 8px;
      background: var(--highlight);
      border-radius: 14px 14px 4px 14px;
    }
    #saki-desktop-contacts .bubble-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    #saki-desktop-contacts .msg-time {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--subtle);
    }
    #saki-desktop-contacts .msg-user .msg-time { text-align: right; }
    #saki-desktop-contacts .msg-contact,
    #saki-desktop-contacts .activity-row,
    #saki-desktop-contacts .working-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    #saki-desktop-contacts .msg-body { min-width: 0; padding-top: 1px; }
    #saki-desktop-contacts .msg-head {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 3px;
      font-size: 11.5px;
      color: var(--subtle);
    }
    #saki-desktop-contacts .msg-name { font-weight: 600; color: var(--text); }
    #saki-desktop-contacts .msg.is-highlighted .bubble,
    #saki-desktop-contacts .msg.is-highlighted .msg-body {
      background: var(--iris-tint);
      box-shadow: 0 0 0 8px var(--iris-tint);
      border-radius: 10px;
    }
    #saki-desktop-contacts .msg-user.is-highlighted .bubble { background: var(--iris-tint); }
    #saki-desktop-contacts .msg-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    /* ---------- activity ---------- */
    #saki-desktop-contacts .activity-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--overlay);
      color: var(--foam);
    }
    #saki-desktop-contacts .activity-details { min-width: 0; }
    #saki-desktop-contacts .activity-details > summary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 2px 0;
      font-size: 12.5px;
      color: var(--subtle);
      list-style: none;
    }
    #saki-desktop-contacts .activity-details > summary::-webkit-details-marker { display: none; }
    #saki-desktop-contacts .activity-details > summary::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: none;
      border-right: 1.5px solid var(--subtle);
      border-bottom: 1.5px solid var(--subtle);
      transform: rotate(-45deg);
      transition: transform 0.12s ease;
    }
    #saki-desktop-contacts .activity-details[open] > summary::before { transform: rotate(45deg); }
    #saki-desktop-contacts .activity-details > summary:hover { color: var(--link); }
    #saki-desktop-contacts .activity-details > summary:hover::before { border-color: var(--link); }
    #saki-desktop-contacts .activity-body {
      margin-top: 6px;
      padding-left: 13px;
      border-left: 2px solid var(--rule);
    }
    #saki-desktop-contacts .activity-steps { display: flex; flex-direction: column; gap: 5px; }
    #saki-desktop-contacts .activity-steps li {
      position: relative;
      padding-left: 14px;
      font-size: 12.5px;
      color: var(--subtle);
    }
    #saki-desktop-contacts .activity-steps li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--foam);
    }
    #saki-desktop-contacts .activity-sources { margin-top: 9px; }
    #saki-desktop-contacts .source-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 9px;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-size: 12px;
      color: var(--subtle);
    }
    #saki-desktop-contacts .source-action:hover { border-color: var(--link); color: var(--link); }
    #saki-desktop-contacts .source-action svg.lucide,
    #saki-desktop-contacts .source-action [data-lucide] { width: 14px; height: 14px; color: var(--foam); }

    /* ---------- working / alert ---------- */
    #saki-desktop-contacts .working-bubble {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      font-size: 12.5px;
      color: var(--subtle);
    }
    #saki-desktop-contacts .working-name { font-weight: 600; color: var(--text); }
    #saki-desktop-contacts .dots { display: inline-flex; gap: 3px; }
    #saki-desktop-contacts .dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--pine);
      animation: saki-pulse 1.2s ease-in-out infinite;
    }
    #saki-desktop-contacts .dots i:nth-child(2) { animation-delay: 0.15s; }
    #saki-desktop-contacts .dots i:nth-child(3) { animation-delay: 0.3s; }
    #saki-desktop-contacts .alert {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding: 9px 11px;
      background: var(--gold-tint);
      border: 1px solid var(--gold);
      border-radius: 10px;
    }
    #saki-desktop-contacts .alert-copy { font-size: 12.5px; font-weight: 500; color: var(--text); }
    #saki-desktop-contacts .alert-detail { margin-top: 2px; font-size: 11.5px; color: var(--subtle); }
    #saki-desktop-contacts .alert-resolved { font-size: 12px; color: var(--subtle); }

    /* ---------- composer ---------- */
    #saki-desktop-contacts .composer {
      border-top: 1px solid var(--rule-soft);
      padding: 10px 20px 13px;
    }
    #saki-desktop-contacts .composer-inner {
      width: 100%;
      max-width: calc(var(--reading) + 56px);
      margin: 0 auto;
    }
    #saki-desktop-contacts .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    #saki-desktop-contacts .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 3px 4px 3px 10px;
      background: var(--overlay);
      border: 1px solid var(--rule-soft);
      border-radius: 999px;
      font-size: 12px;
      color: var(--text);
    }
    #saki-desktop-contacts .chip > svg.lucide,
    #saki-desktop-contacts .chip > [data-lucide] { color: var(--foam); }
    #saki-desktop-contacts .chip-name {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    #saki-desktop-contacts .chip-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex: none;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 50%;
      color: var(--subtle);
    }
    #saki-desktop-contacts .chip-remove:hover { background: var(--surface); color: var(--love); }
    #saki-desktop-contacts .chip-remove svg.lucide,
    #saki-desktop-contacts .chip-remove [data-lucide] { width: 12px; height: 12px; }
    #saki-desktop-contacts .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 5px 5px 5px 7px;
      background: var(--overlay);
      border: 1px solid var(--rule-soft);
      border-radius: 12px;
    }
    #saki-desktop-contacts .composer-box:focus-within { border-color: var(--iris); }
    #saki-desktop-contacts .composer-box textarea {
      flex: 1;
      min-width: 0;
      min-height: 38px;
      max-height: 160px;
      padding: 7px 4px;
      background: transparent;
      border: 0;
      resize: none;
    }
    #saki-desktop-contacts .composer-box textarea:focus { outline: none; }
    #saki-desktop-contacts .composer-box textarea::placeholder { color: var(--subtle); }
    #saki-desktop-contacts .send-action {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 14px;
      background: var(--rose);
      border: 0;
      border-radius: 9px;
      color: var(--on-action);
      font-size: 13px;
      font-weight: 600;
    }
    #saki-desktop-contacts .send-action:disabled { opacity: 0.5; }
    #saki-desktop-contacts .composer-hint {
      margin-top: 6px;
      padding: 0 2px;
      font-size: 11.5px;
      color: var(--subtle);
    }

    /* ---------- forms ---------- */
    #saki-desktop-contacts .form-view {
      width: 100%;
      max-width: calc(var(--reading) + 56px);
      margin: 0 auto;
      padding: 22px 20px 26px;
    }
    #saki-desktop-contacts .form-head { margin-bottom: 18px; }
    #saki-desktop-contacts .form-head h2 { font-size: 17px; font-weight: 600; }
    #saki-desktop-contacts .form-lede {
      margin-top: 5px;
      font-size: 12.5px;
      color: var(--subtle);
    }

              view: state.view,
              design: { railWidth: design.railWidth, messageGap: design.messageGap, readingWidth: design.readingWidth }

          });

          /* host widget state is optional */

      function applyWidgetState(saved) {
        if (!saved || typeof saved !== 'object') return;
        const model = saved.modelContent;
        const privateContent = saved.privateContent;
        if (model && typeof model === 'object') {
          if (typeof model.selectedContact === 'string' && contactById(model.selectedContact)) state.selectedId = model.selectedContact;

      // ---------- building blocks ----------
      function buildAvatar(large) {
        const node = el('span', 'avatar' + (large ? ' avatar-lg' : ''));
        node.setAttribute('aria-hidden', 'true');
        const image = document.createElement('img');
        image.className = 'avatar-img';
        image.src = AVATAR_DEFAULT_SRC;
        image.alt = '';
        node.append(image);
        return node;
      }
      function buildAction(iconName, label, action, id, ariaLabel) {
        const button = el('button', 'action');
        button.type = 'button';
        button.dataset.action = action;
        if (id) button.dataset.id = id;
        if (ariaLabel) button.setAttribute('aria-label', ariaLabel);
        if (iconName) button.append(icon(iconName));
        if (label) button.append(el('span', 'action-label', label));
        return button;
      }
      function buildField(options) {
        const field = el('div', 'field');
        const label = el('label', 'field-label', options.label);
        label.setAttribute('for', options.id);
        if (options.required) label.append(el('span', 'required-note', 'Required'));
        field.append(label);
        const control = options.multiline ? el('textarea') : el('input');
        control.id = options.id;
        if (options.multiline) control.rows = options.rows || 3;
        else control.type = options.inputType || 'text';
        control.value = options.value || '';
        if (options.placeholder) control.placeholder = options.placeholder;
        if (options.errorId) control.setAttribute('aria-describedby', options.errorId);
        field.append(control);
        if (options.hint) field.append(el('p', 'field-hint', options.hint));
        if (options.errorId) {
          const error = el('p', 'field-error', options.errorText || 'This field is required.');
          error.id = options.errorId;
          error.hidden = true;
          error.setAttribute('role', 'alert');
          field.append(error);
        }
        return { field, control };
      }
      function snippetFor(contact) {
        for (let index = contact.messages.length - 1; index >= 0; index -= 1) {
          const message = contact.messages[index];
          if (message.kind === 'activity') continue;
          const text = (message.text || '').replace(/\s+/g, ' ').trim();
          if (text) return (message.from === 'me' ? 'You: ' : '') + truncate(text, 58);
          if (message.attachments && message.attachments.length) return plural(message.attachments.length, 'attachment', 'attachments');
        }
        if (contact.status === 'working') return contact.work || 'Working';
        return 'No messages yet';
      }
      function attentionDetail(contact) {
        for (let index = contact.messages.length - 1; index >= 0; index -= 1) {
          const message = contact.messages[index];
          if (message && message.alert && message.alert.title) return message.alert.title;
        }
        return '';
      }
      function historyAsMessage(entry) {
        return { id: entry.id, from: entry.from === 'me' ? 'me' : 'contact', text: entry.text, time: entry.date };
      }
      function composerHint(contact) {
        if (contact.status === 'working') return 'Working \u2014 you can switch contacts; progress stays here.';
        return 'Enter to send \u00b7 Shift + Enter for a new line.';
      }
      function historyMatches(contact) {
        const query = state.historyQuery.trim().toLowerCase();
        const newestFirst = contact.history.slice().reverse();
        if (!query) return newestFirst;
        return newestFirst.filter((entry) => {
          const haystack = (entry.text + ' ' + entry.date + ' ' + speakerName(entry, contact)).toLowerCase();
          return haystack.indexOf(query) !== -1;
        });
      }

      // ---------- rail ----------
      function renderRail() {
        const list = root.querySelector('#saki-contact-list');
        list.textContent = '';
        contacts.forEach((contact) => {
          const item = el('li');
          const row = el('button', 'contact-row' + (contact.id === state.selectedId ? ' is-selected' : ''));
          row.type = 'button';
          row.dataset.action = 'select-contact';
          row.dataset.id = contact.id;
          if (contact.id === state.selectedId) row.setAttribute('aria-current', 'true');
          const top = el('span', 'contact-top');
          top.append(el('span', 'contact-name', contact.name));
          if (contact.unread > 0) top.append(el('span', 'unread-badge', String(contact.unread)));
          const main = el('span', 'contact-main');
          main.append(top, el('span', 'contact-snippet', snippetFor(contact)));
          if (contact.status !== 'ready') {
            const status = el('span', 'contact-status status-' + contact.status);
            status.append(el('span', 'status-dot'));
            let statusText = statusLabels[contact.status] || contact.status;
            if (contact.status === 'working' && contact.work) statusText += ' \u00b7 ' + contact.work;
            status.append(document.createTextNode(statusText));
            main.append(status);
          }
          row.append(buildAvatar(), main);
          item.append(row);
          list.append(item);
        });
      }

      // ---------- chat ----------
      function buildChatHeader(contact) {
        const header = el('header', 'chat-head');
        const who = el('div', 'chat-who');
        who.append(buildAvatar(true));
        const textWrap = el('div', 'chat-who-text');
        textWrap.append(el('h2', 'chat-name', contact.name));
        const meta = el('p', 'chat-meta status-' + contact.status);
        meta.append(el('span', 'status-dot'));
        let metaText = (statusLabels[contact.status] || contact.status) + ' \u00b7 ' + (contact.role || 'Contact');
        if (contact.status === 'working' && contact.work) metaText += ' \u00b7 ' + contact.work;
        if (contact.status === 'attention') {
          const detail = attentionDetail(contact);
          if (detail) metaText += ' \u00b7 ' + detail;
        }
        meta.append(document.createTextNode(metaText));

      // ---------- simulated work ----------
      function beginWork(contact, label, duration, finish, options) {
        const opts = options || {};
        contact.status = 'working';
        contact.work = label;
        if (timers[contact.id]) window.clearTimeout(timers[contact.id]);
        if (opts.announce !== false) announce(contact.name + ' is working.');
        timers[contact.id] = window.setTimeout(() => {
          timers[contact.id] = null;
          contact.work = null;
          finish();
          const viewingChat = state.selectedId === contact.id && state.view === 'chat';
          if (!viewingChat) contact.unread = (contact.unread || 0) + 1;
          if (state.selectedId === contact.id) updateChatSurface(contact);
          else {
            renderRail();
            refreshIcons();
          }
          if (viewingChat) announce(contact.name + ' replied.');
          else announce('New reply from ' + contact.name + '.');
          persist();
        }, duration);
      }
      function nextReply(contact) {
        const list = cannedReplies[contact.id];
        if (!list || !list.length) return 'Noted. I will keep this thread in view and follow up here.';
        const reply = list[contact.replyIndex % list.length];
        contact.replyIndex += 1;
        return reply;
      }
      function seedRenWork() {
        const ren = contactById('ren');
        if (!ren || ren.status !== 'working') return;
        beginWork(ren, 'Running the parser tests', 18000, () => {
          ren.status = 'attention';
          ren.messages.push({
            id: uid('m'), from: 'contact', time: nowTime(),
            text: 'Two failures in parser_roundtrip: expected eof, got newline. The trailing-newline change is the likely cause.',
            alert: { title: 'Run failed \u00b7 2 failing tests', detail: 'cargo test \u2014 parser_roundtrip' },
            retry: true
          });
        }, { announce: false });
      }

      // ---------- actions ----------
      function handleSend(contact) {
        if (!contact || contact.status === 'working') return;
        const textarea = root.querySelector('#saki-composer-text');
        const text = (textarea ? textarea.value : drafts[contact.id] || '').trim();
        const attached = (attachments[contact.id] || []).slice();
        if (!text && !attached.length) {
          announce('Write a message or attach a file first.');
          if (textarea) textarea.focus();
          return;
        }
        const message = { id: uid('m'), from: 'me', text, time: nowTime() };
        if (attached.length) message.attachments = attached;
        contact.messages.push(message);
        drafts[contact.id] = '';
        attachments[contact.id] = [];
        beginWork(contact, contact.workLabel || 'Preparing a reply', 1800, () => {
          contact.status = 'ready';
          contact.messages.push({ id: uid('m'), from: 'contact', text: nextReply(contact), time: nowTime() });
        });
        if (textarea) textarea.value = '';
        renderAttachmentChips(contact);
        updateChatSurface(contact);
        if (textarea) textarea.focus();
        announce('Message sent to ' + contact.name + '.');
        persist();
      }
      function addAttachmentFiles(contact, fileList) {
        if (!fileList || !fileList.length) return;
        const names = attachments[contact.id] || [];
        for (let index = 0; index < fileList.length && names.length < 4; index += 1) {
          const name = fileList[index] && fileList[index].name;
          if (typeof name === 'string' && name) names.push(name);
        }
        attachments[contact.id] = names;
        renderAttachmentChips(contact);
        announce(plural(names.length, 'file', 'files') + ' attached to this draft.');
      }
      function removeAttachment(index) {
        const names = attachments[state.selectedId] || [];
        if (index < 0 || index >= names.length) return;
        const removed = names[index];
        names.splice(index, 1);
        renderAttachmentChips(selected());
        announce('Removed ' + removed + '.');
      }
      function selectContact(id) {
        const contact = contactById(id);
        if (!contact) return;
        const previous = selected();
        const textarea = root.querySelector('#saki-composer-text');
        if (textarea && previous) drafts[previous.id] = textarea.value;
        state.selectedId = id;
        contact.unread = 0;
        state.view = 'chat';
        state.aux = null;
        state.historyQuery = '';
        state.highlightId = null;
        state.railOpen = false;
        render();
        if (mediaFine.matches) {
          const input = root.querySelector('#saki-composer-text');

        }
        announce('Selected ' + contact.name + '.');
        persist();
      }
      function openAdd() {

      function handleCreate() {

          if (input) { input.setAttribute('aria-invalid', 'true'); input.focus(); }
          announce('Contact name is required.');

        }
        const contact = {
          id: uid('contact'),
          name,
          role: 'New contact',
          purpose: addDraft.purpose.trim(),
          instructions: addDraft.instructions.trim(),
          workspace: addDraft.workspace.trim(),
          status: 'ready',
          unread: 0,
          work: null,
          workLabel: 'Preparing a reply',
          replyIndex: 0,
          revealed: [],
          messages: [],
          history: []
        };
        contacts.push(contact);
        addDraft.name = '';
        addDraft.purpose = '';
        addDraft.instructions = '';
        addDraft.workspace = '';

        state.view = 'chat';
        state.aux = null;
        state.highlightId = null;

      function cancelAdd() {
        state.view = 'chat';
        state.highlightId = null;
        render();
        announce('Add contact cancelled. The previous draft is unchanged.');
      }
      function openSettings() {
        const contact = selected();
        settingsDraft.id = contact.id;
        settingsDraft.name = contact.name;
        settingsDraft.purpose = contact.purpose || '';
        settingsDraft.instructions = contact.instructions || '';
        settingsDraft.workspace = contact.workspace || '';
        state.aux = { kind: 'settings' };
        render();
        if (window.matchMedia('(min-width: 920px)').matches) {
          const input = root.querySelector('#saki-settings-name');
          if (input) input.focus();
        }
        announce('Contact settings for ' + contact.name + ' opened.');
      }
      function handleSaveSettings() {
        const contact = selected();
        const name = settingsDraft.name.trim();
        const error = root.querySelector('#saki-settings-name-error');
        if (!name) {
          if (error) error.hidden = false;
          const input = root.querySelector('#saki-settings-name');
          if (input) { input.setAttribute('aria-invalid', 'true'); input.focus(); }
          announce('Contact name is required.');
          return;
        }
        contact.name = name;
        contact.purpose = settingsDraft.purpose.trim();
        contact.instructions = settingsDraft.instructions.trim();
        contact.workspace = settingsDraft.workspace.trim();
        state.aux = null;
        state.flash = 'Profile saved. Changes apply to future messages; saved history stays intact.';
        render();
        announce('Contact settings saved for ' + contact.name + '.');
        const flashText = state.flash;
        window.setTimeout(() => {
          if (state.flash === flashText) {
            state.flash = null;
            if (state.view === 'chat') updateChatSurface(selected());
          }
        }, 5000);
        persist();
      }
      function closeAux() {
        const kind = state.aux ? state.aux.kind : null;
        state.aux = null;
        render();
        if (kind === 'settings') announce('Settings closed without changes.');
      }
      function openSources(messageId) {
        state.aux = { kind: 'sources', messageId };
        render();
        announce('Sources for the reply from ' + selected().name + '.');
      }
      function openHistory() {
        state.view = 'history';
        state.aux = null;
        state.historyQuery = '';
        state.railOpen = false;
        render();
        const input = root.querySelector('#saki-history-search');
        if (input) input.focus();
        announce('History search for ' + selected().name + '. Only this contact\u2019s messages are searched.');
      }
      function backToChat() {
        state.view = 'chat';
        state.highlightId = null;
        render();
        announce('Returned to the conversation with ' + selected().name + '.');
      }
      function refreshHistoryResults() {
        const box = root.querySelector('#saki-history-results');
        if (!box) return;
        buildHistoryResults(box, selected());
        const count = historyMatches(selected()).length;
        announce(count
          ? plural(count, 'message', 'messages') + ' match in ' + selected().name + '\u2019s history.'
          : 'No messages match in ' + selected().name + '\u2019s history.');
      }
      function viewInConversation(historyId) {
        const contact = selected();
        const entry = contact.history.find((item) => item.id === historyId);
        if (!entry) return;
        if (contact.revealed.indexOf(historyId) === -1) contact.revealed.push(historyId);
        state.highlightId = historyId;
        state.view = 'chat';
        if (!window.matchMedia('(min-width: 920px)').matches) state.aux = null;
        render();
        window.setTimeout(() => {
          const node = root.querySelector('[data-message-id="' + historyId + '"]');
          if (node && typeof node.scrollIntoView === 'function') {
            node.scrollIntoView({ block: 'center', behavior: mediaReduce.matches ? 'auto' : 'smooth' });
          }
        }, 40);
        window.setTimeout(() => {
          if (state.highlightId === historyId) state.highlightId = null;
          const node = root.querySelector('[data-message-id="' + historyId + '"]');
          if (node) node.classList.remove('is-highlighted');
        }, 6000);
        announce('Showing the earlier message from ' + entry.date + ' in the conversation.');
        persist();
      }
      function retryRun(messageId) {
        const contact = selected();
        const message = contact.messages.find((item) => item.id === messageId);
        if (!message || !message.retry || message.retryDone) return;
        message.retryDone = true;
        beginWork(contact, 'Re-running the parser tests', 2600, () => {
          contact.status = 'ready';
          contact.messages.push({ id: uid('m'), from: 'contact', text: 'Fixed the trailing-newline branch. Parser tests pass now: 64 passed, 0 failed.', time: nowTime() });
        });
        updateChatSurface(contact);
      }

      // ---------- events ----------
      root.addEventListener('click', (event) => {
        const trigger = event.target.closest('[data-action]');
        if (!trigger || !root.contains(trigger)) return;
        const action = trigger.dataset.action;
        if (action === 'select-contact') selectContact(trigger.dataset.id);
        else if (action === 'toggle-rail') {
          state.railOpen = !state.railOpen;
          render();
          const toggle = root.querySelector('#saki-rail-toggle');
          if (toggle) toggle.focus();
        } else if (action === 'open-add') openAdd();
        else if (action === 'cancel-add') cancelAdd();
        else if (action === 'create-contact') handleCreate();
        else if (action === 'send-message') handleSend(selected());
        else if (action === 'open-history') openHistory();
        else if (action === 'open-settings') openSettings();
        else if (action === 'close-aux') closeAux();
        else if (action === 'open-sources') openSources(trigger.dataset.messageId);
        else if (action === 'view-in-conversation') viewInConversation(trigger.dataset.id);
        else if (action === 'back-to-chat') backToChat();
        else if (action === 'attach') {
          const input = root.querySelector('#saki-file-input');
          if (input) input.click();
        } else if (action === 'remove-attachment') removeAttachment(Number(trigger.dataset.index));
        else if (action === 'retry') retryRun(trigger.dataset.id);
        else if (action === 'save-settings') handleSaveSettings();
      });
      root.addEventListener('submit', (event) => {
        const form = event.target;
        if (!form || !form.id) return;
        if (form.id === 'saki-composer') { event.preventDefault(); handleSend(selected()); }
        else if (form.id === 'saki-add-form') { event.preventDefault(); handleCreate(); }
        else if (form.id === 'saki-settings-form') { event.preventDefault(); handleSaveSettings(); }
      });
      root.addEventListener('input', (event) => {
        const target = event.target;
        if (!target || !target.id) return;
        if (target.id === 'saki-composer-text') drafts[state.selectedId] = target.value;
        else if (target.id === 'saki-history-search') { state.historyQuery = target.value; refreshHistoryResults(); }
        else if (target.id === 'saki-add-name') { addDraft.name = target.value; hideFieldError('saki-add-name-error', target); }
        else if (target.id === 'saki-add-purpose') addDraft.purpose = target.value;
        else if (target.id === 'saki-add-instructions') addDraft.instructions = target.value;
        else if (target.id === 'saki-add-workspace') addDraft.workspace = target.value;
        else if (target.id === 'saki-settings-name') { settingsDraft.name = target.value; hideFieldError('saki-settings-name-error', target); }
        else if (target.id === 'saki-settings-purpose') settingsDraft.purpose = target.value;
        else if (target.id === 'saki-settings-instructions') settingsDraft.instructions = target.value;
        else if (target.id === 'saki-settings-workspace') settingsDraft.workspace = target.value;
      });
      function hideFieldError(errorId, control) {
        const error = root.querySelector('#' + errorId);
        if (!error || error.hidden) return;
        error.hidden = true;
        control.removeAttribute('aria-invalid');
      }
      root.addEventListener('change', (event) => {
        const target = event.target;
        if (target && target.id === 'saki-file-input') {
          addAttachmentFiles(selected(), target.files);
          target.value = '';
        }
      });
      root.addEventListener('keydown', (event) => {
        const target = event.target;
        if (target && target.id === 'saki-composer-text') {
          if (event.key === 'Enter' && !event.shiftKey) {
            if (event.isComposing || event.keyCode === 229) return;
            event.preventDefault();
            handleSend(selected());
            return;
          }
        }
        if (event.key === 'Enter' && target && target.tagName === 'INPUT') {
          if (target.id === 'saki-add-name' || target.id === 'saki-add-workspace') {
            event.preventDefault();
            handleCreate();
            return;
          }
          if (target.id === 'saki-settings-name' || target.id === 'saki-settings-workspace') {
            event.preventDefault();
            handleSaveSettings();
            return;
          }
        }
        if (event.key === 'Escape') {
          if (state.aux) closeAux();
          else if (state.view === 'add') cancelAdd();
          else if (state.view === 'history') backToChat();
        }
      });

      // ---------- init ----------
      applyDesign();
      const initialWidget = window.openai && window.openai.widgetState;
      if (initialWidget) applyWidgetState(initialWidget);
      if (!contactById(state.selectedId)) state.selectedId = contacts[0].id;
      render();
      seedRenWork();
      window.addEventListener('openai:set_globals', (event) => {
        const globals = event && event.detail ? event.detail.globals : null;
        const widgetState = globals ? globals.widgetState : null;
        if (!widgetState) return;
        applyWidgetState(widgetState);
        applyDesign();
        if (!contactById(state.selectedId)) state.selectedId = contacts[0].id;
        render();
      });

      // ---------- optional design controls ----------
      if (globalThis.Tweak) {
        const tweak = new Tweak({
          container: root,
          onChange: () => { applyDesign(); persist(); }
        });
        tweak.addSlider(design, 'railWidth', { label: 'Contact list width', min: 180, max: 280, step: 10, unit: 'px' });
        tweak.addSlider(design, 'messageGap', { label: 'Message spacing', min: 10, max: 30, step: 2, unit: 'px' });
        tweak.addSlider(design, 'readingWidth', { label: 'Reading width', min: 520, max: 760, step: 20, unit: 'px' });
      }
    })();
  </script>
</div>
