<!doctype html>
<html lang="zh-CN" data-theme="moon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saki · 联系人对话设计原型</title>
<style>
:root{color-scheme:dark;--bg:#232136;--surface:#2a273f;--hover:#393552;--border:#44415a;--text:#e0def4;--muted:#b8b4cc;--accent:#ea9a97;--accent-hover:#f2b0ad;--accent-text:#232136;--danger:#f79bb2;--warning:#f6c177;--success:#9ccfd8;--focus:#c4a7e7;--canvas:#1c1a2b;--shadow:0 24px 80px #0003}

[data-theme=dawn]{color-scheme:light;--bg:#faf4ed;--surface:#fffaf3;--hover:#f2e9e1;--border:#dfdad9;--text:#464261;--muted:#64607b;--accent:#d7827e;--accent-hover:#e09a96;--accent-text:#232136;--danger:#9c4a62;--warning:#985900;--success:#286983;--focus:#907aa9;--canvas:#eee7e0;--shadow:0 24px 80px #50466118}

*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent;border-radius:8px;transition:background-color 120ms,color 120ms}
button:hover{background:var(--hover)}
button:active{filter:brightness(.95)}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
button svg{pointer-events:none}
svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1{font-size:15px;font-weight:600}
h2{font-size:21px;line-height:1.4;font-weight:600;letter-spacing:-.4px}
h3{font-size:15px;font-weight:600}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
code{padding:2px 5px;background:var(--hover);border-radius:4px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;margin:0}
a{color:var(--success)}
.muted{color:var(--muted)}
.small{font-size:12px}
.icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{border:1px solid var(--border);padding:5px 10px;border-radius:99px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.design-bar{max-width:1200px;margin:20px auto 14px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px}
.design-brand{display:flex;gap:10px;align-items:center}
.design-brand strong{font-size:14px}
.design-badge{border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--muted)}
.design-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.design-controls select{border:0;background:var(--surface);border-radius:6px;padding:5px 8px;font-size:12px}
.segmented{display:flex;padding:3px;border:1px solid var(--border);border-radius:8px}
.segmented button{padding:3px 10px;font-size:12px}
.segmented button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 3px #0001}
.app{position:relative;display:grid;grid-template-columns:220px minmax(0,1fr);width:min(var(--frame,1040px),calc(100% - 48px));height:min(720px,calc(100dvh - 112px));min-height:520px;margin:0 auto;border:1px solid var(--border);border-radius:15px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.rail{display:flex;flex-direction:column;background:var(--bg);padding:16px 10px 12px;min-height:0}
.brand{height:38px;padding:0 14px;display:flex;align-items:center;gap:9px;font-size:17px;font-weight:650;letter-spacing:-.4px}
.brand svg{color:var(--accent);width:20px;height:20px}
.rail-label{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 9px;font-size:12px;color:var(--muted)}
.rail-label button{font-size:12px;padding:5px 7px}
.contacts{display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}
.contact{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border-radius:11px;text-align:left;min-height:68px}
.contact[aria-current=true]{background:var(--hover)}
.avatar{width:32px;height:32px;border-radius:11px;object-fit:cover;background:var(--hover);flex:none}
.contact .name{font-weight:550;line-height:22px}
.snippet{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:146px}
.contact .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.rail-footer{border-top:1px solid var(--border);padding:12px 10px 0;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.rail-footer button{padding:5px 8px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.reading{width:86%;max-width:760px;margin-inline:auto}
.header{flex:none;height:76px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.header .avatar{width:28px;height:28px;border-radius:9px}
.identity{display:flex;align-items:center;gap:9px;min-width:0}
.status-text{font-size:12px;color:var(--muted)}
.header-actions{display:flex;gap:4px}
.header-actions button{display:flex;align-items:center;gap:6px;padding:8px 9px;font-size:12px;color:var(--muted)}
.header-actions button[aria-expanded=true]{background:var(--hover);color:var(--text)}
.work-strip{flex:none;display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:12px;border:1px solid var(--border);border-radius:11px;background:var(--bg)}
.work-strip strong{font-size:12px;font-weight:550}
.work-strip p{font-size:12px;color:var(--muted);margin-top:3px}
.work-strip button{font-size:12px;color:var(--success);padding:7px 8px;white-space:nowrap}
.work-strip #stop-work{color:var(--muted);border:1px solid var(--border)}
.work-state{font-size:11px;color:var(--muted)}
.work-indicator{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.work-indicator.running{background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 12%,transparent)}
.work-indicator.failed{background:var(--danger)}
.work-indicator.completed{background:var(--success)}
.work-steps{list-style:none;padding:0;margin:0}
.work-steps .tool{padding:10px 0;margin:0}
.work-steps .tool summary{flex-wrap:wrap;gap:5px;line-height:1.6}
.work-steps .tool-output{overflow-wrap:anywhere}
.work-steps pre{font-size:11px}
.scroll{flex:1;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
.conversation{padding:6px 0 24px;overflow-wrap:anywhere}
.date{text-align:center;font-size:11px;color:var(--muted);margin:0 0 20px;letter-spacing:.4px}
#thread{display:flex;flex-direction:column;gap:18px}
.message{display:flex;align-items:flex-start;gap:9px;min-width:0}
.message.user{justify-content:flex-end}
.message>.avatar{width:28px;height:28px;border-radius:9px;margin-top:3px}
.message-body{min-width:0;max-width:calc(100% - 37px)}
.user .message-body{max-width:78%}
.sender{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 5px 3px}
.bubble{width:fit-content;max-width:100%;padding:12px 16px;font-size:14px;line-height:1.7;border-radius:4px 18px 18px 18px;background:var(--bg);border:1px solid color-mix(in srgb,var(--border) 55%,transparent)}
.user .bubble{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:transparent;border-radius:18px 4px 18px 18px;white-space:pre-wrap}
.bubble p+p{margin-top:10px}
.bubble h3{font-size:14px;margin:18px 0 8px}
.bubble ul{padding-left:18px;margin:8px 0 0}
.bubble li{padding:3px 0}
.bubble li::marker{color:var(--muted)}
.message-meta{display:flex;align-items:center;gap:8px;font-size:11px;line-height:20px;color:var(--muted);margin:4px 3px 0}
.user .message-meta{justify-content:flex-end}
.message-meta button{display:inline-flex;align-items:center;gap:4px;padding:2px 5px;font-size:11px}
.message-meta svg{width:13px;height:13px}
.message-detail{margin:12px 0;border-block:1px solid var(--border);padding:10px 0}
.message-detail summary{cursor:pointer;font-size:13px;color:var(--success)}
.tool{margin:0 0 10px;padding-bottom:9px;border-bottom:1px solid var(--border);font-size:12px;line-height:1.5;color:var(--muted)}
.tool summary{display:flex;align-items:center;gap:7px;cursor:pointer;padding:3px 0;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool summary .chevron{width:14px;height:14px;transition:transform 120ms}
.tool[open] .chevron{transform:rotate(90deg)}
.tool .ok{color:var(--success);width:15px;height:15px}
.tool-output{margin-top:9px;padding:10px 12px;background:var(--surface);border-radius:8px}
.tool-output .row{margin-bottom:10px}
.table-wrap{max-width:100%;border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px;line-height:1.7;text-align:left}
caption{text-align:left;padding:9px 11px;color:var(--muted);background:var(--surface)}
th,td{padding:10px 11px;vertical-align:top;border-top:1px solid var(--border)}
th{font-weight:600;background:var(--surface)}
th,td{overflow-wrap:anywhere}
.table-actions{display:flex;justify-content:flex-end;margin:5px 0 12px}
.table-actions button{font-size:12px;padding:5px 7px;color:var(--success)}
.chart{margin:14px 0 12px;padding:12px;background:var(--surface);border-radius:10px}
.chart figcaption{font-size:13px;font-weight:550;margin-bottom:8px}
.chart svg{display:block;width:100%;height:auto;fill:none;stroke:none}
.chart text{fill:var(--muted);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.chart .track{fill:var(--hover)}
.chart .bar-rose{fill:var(--accent)}
.chart .bar-iris{fill:var(--focus)}
.chart .bar-foam{fill:var(--success)}
.chart button{font-size:12px;color:var(--success);padding:5px 7px}
.chart-note{font-size:11px;color:var(--muted);margin-top:6px}
.content-modal{width:min(920px,calc(100vw - 64px));max-height:calc(100dvh - 80px);padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--text);box-shadow:var(--shadow)}
.content-modal::backdrop{background:#12101d88}
.content-modal h2{font-size:16px;letter-spacing:0}
.content-modal #content-detail{margin-top:18px}
.content-modal .chart{margin-bottom:0}
.content-modal .chart figcaption{display:none}
.content-modal .chart svg{min-width:0}
.bubble:focus-visible,[data-expand-content]:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.spinner{width:13px;height:13px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}
}
.composer-wrap{flex:none;padding:10px 0 17px}
.composer{border:1px solid var(--border);border-radius:18px;background:var(--bg);padding:13px 14px 10px;box-shadow:0 2px 8px #00000006}
.composer:focus-within{border-color:var(--focus)}
textarea{display:block;width:100%;min-height:52px;max-height:140px;resize:none;border:0;outline:0;background:transparent;font-size:14px;line-height:1.65;padding:0 3px;margin-bottom:8px}
textarea:focus-visible{outline:0}
textarea::placeholder{color:var(--muted)}
.composer-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.workspace{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 4px;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.send{display:flex;align-items:center;justify-content:center;gap:6px;min-width:36px;height:36px;padding:0 10px;background:var(--accent);color:var(--accent-text);border-radius:11px;font-size:12px;font-weight:600}
.send:hover{background:var(--accent-hover)}
.compose-hint{font-size:11px;color:var(--muted);padding:8px 4px 0;display:flex;justify-content:space-between;gap:10px}
.error{margin:0 auto 4px;padding:13px 15px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:12px}
.error strong{color:var(--danger);font-weight:600;font-size:13px}
.error p{margin-top:6px;color:var(--muted);line-height:1.6}
.error button{padding:5px 0;color:var(--success);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px 0 48px}
.empty .avatar{width:64px;height:64px;border-radius:22px;margin-bottom:22px}
.empty h2{font-size:23px}
.empty p{color:var(--muted);font-size:14px;line-height:1.8;margin-top:10px;max-width:300px}
.panel{padding:0;border:0;color:var(--text);background:var(--bg);border-left:1px solid var(--border);width:300px;max-width:none;max-height:none}
.panel[open]{display:flex;flex-direction:column;animation:panel-in 160ms ease-out}
.app.wide.panel-open{grid-template-columns:220px minmax(0,1fr) 300px}
.app.wide .panel{position:relative;margin:0;height:100%;min-height:0}
.app:not(.wide) .panel{position:fixed;top:var(--panel-top);right:var(--panel-right);bottom:auto;left:auto;height:var(--panel-height);margin:0;border-radius:0 15px 15px 0;max-width:calc(100vw - 48px);box-shadow:-15px 0 50px #0002}
.panel::backdrop{background:#12101d55}
.panel-head{display:flex;align-items:center;justify-content:space-between;flex:none;padding:23px 20px 15px}
.panel-head h2{font-size:15px;letter-spacing:0}
.panel-content{padding:6px 20px 22px;overflow:auto;min-height:0;font-size:13px}
.panel-content label{display:block;font-size:12px;font-weight:550;margin:18px 0 7px}
.panel-content label:first-child{margin-top:0}
.field{width:100%;border:1px solid var(--border);background:var(--surface);padding:9px 10px;border-radius:8px;font-size:13px}
.field:disabled{color:var(--muted);background:var(--bg)}
.help{font-size:12px;line-height:1.65;color:var(--muted);margin:8px 0 0}
.section-title{font-size:12px;font-weight:600;margin:26px 0 12px;padding-top:20px;border-top:1px solid var(--border)}
.theme-options{display:flex;gap:8px}
.theme-options button{flex:1;padding:10px;border:1px solid var(--border);font-size:12px;display:flex;gap:7px;align-items:center}
.theme-options button[aria-pressed=true]{border-color:var(--focus)}
.swatch{width:17px;height:17px;border:1px solid #8885;border-radius:50%;background:#232136}
.swatch.dawn{background:#faf4ed}
.history-row{width:100%;text-align:left;padding:12px 8px;border-bottom:1px solid var(--border);border-radius:0;display:block}
.history-row strong{display:block;font-size:13px;font-weight:500}
.history-row span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.design-note{max-width:1040px;width:calc(100% - 48px);margin:13px auto;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:9px 16px;background:var(--hover);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:12px;z-index:5;box-shadow:0 6px 20px #0002}
@keyframes panel-in{from{opacity:0;transform:translateX(8px)}
to{opacity:1;transform:translateX(0)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
}
@media(max-width:800px){.design-bar{align-items:flex-start;flex-wrap:wrap}
.design-controls{gap:8px;flex-wrap:wrap}
.app{grid-template-columns:180px minmax(0,1fr)}
.snippet{max-width:110px}
.reading{width:90%}
.header-actions button span{display:none}
.design-note{flex-wrap:wrap;gap:4px}
.user .message-body{max-width:88%}
.bubble{padding:11px 13px}
}

</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="i-history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.5 7M3 5v6h6M12 7v5l3 2"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v12H3Z"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5ZM14 3v6h5M9 13h6m-6 4h6"/></symbol><symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
</defs></svg>
<div class="design-bar">
 <div class="design-brand"><strong>Saki</strong><span class="design-badge">设计原型 · 03</span><span class="muted">交流与工作</span></div>
 <div class="design-controls">
  <div class="segmented" aria-label="预览主题"><button data-theme-choice="moon" aria-pressed="true">Moon</button><button data-theme-choice="dawn" aria-pressed="false">Dawn</button></div>
  <label>场景 <select id="scene"><option value="ready">日常对话</option><option value="rich">表格与图表</option><option value="working">安静工作</option><option value="speaking">边工作边说话</option><option value="done">完成但不发消息</option><option value="blocked">工作受阻</option><option value="error">启动异常</option><option value="empty">空对话</option></select></label>
  <button id="speak-demo" class="pill" hidden>模拟 Agent 发消息</button><button id="finish-demo" class="pill" hidden>模拟工作完成</button>
  <label>画布 <select id="frame"><option value="1040">1040</option><option value="960">960</option><option value="1200">1200</option></select></label>
 </div>
</div>
<div class="app" id="app">
 <aside class="rail" aria-label="联系人">
  <div class="brand">Saki</div>
  <div class="rail-label"><span>联系人</span><button id="add-contact" class="row"><svg aria-hidden="true" style="width:13px;height:13px"><use href="#i-plus"/></svg>添加</button></div>
  <nav class="contacts" id="contacts" aria-label="选择联系人"></nav>
  <div class="rail-footer"><span>自己的小小工作台</span><button id="appearance" class="icon" aria-label="打开外观设置"><svg aria-hidden="true"><use href="#i-settings"/></svg></button></div>
 </aside>
 <main class="main">
  <header class="header reading">
   <div class="identity"><img class="avatar" src="assets/saki-avatar-default.png" alt=""><div><h1 id="contact-name">Saki</h1><div class="status-text" id="status-text">可以继续聊</div></div></div>
   <div class="header-actions"><button id="work-button" aria-controls="panel" aria-expanded="false"><svg aria-hidden="true"><use href="#i-folder"/></svg><span>工作</span></button><button id="history-button" aria-controls="panel" aria-expanded="false"><svg aria-hidden="true"><use href="#i-history"/></svg><span>历史</span></button><button id="settings-button" aria-controls="panel" aria-expanded="false"><svg aria-hidden="true"><use href="#i-settings"/></svg><span>设置</span></button></div>
  </header>
  <section class="work-strip reading" id="work-strip" aria-label="工作状态" hidden><span id="work-indicator" class="work-indicator" aria-hidden="true"></span><div class="grow"><div class="row"><strong id="work-title"></strong><span class="work-state" id="work-state"></span></div><p id="work-detail"></p></div><button id="view-work">查看工作</button><button id="stop-work" hidden>停止</button></section>
  <section class="error reading" id="error-banner" role="alert" hidden><strong>尚未启动 · 找不到运行程序</strong><p>已保留草稿。请确认应用包含 Saki-runtime，或配置其位置后重启应用。</p><button id="diagnostics">查看启动诊断</button></section>
  <div class="scroll" id="scroll"><div class="conversation reading" id="conversation">
   <div class="date" id="date-label">今天 · 10:42</div>
   <div id="thread" aria-label="消息记录"></div>
   <section class="empty" id="empty" hidden><img class="avatar" src="assets/saki-avatar-default.png" alt=""><h2>从一件小事开始。</h2><p>整理一个想法，读一份资料，<br>或把想做的事，慢慢说清楚。</p></section>
  </div></div>
  <div class="composer-wrap reading"><div class="composer"><label for="draft" class="sr-only">给当前联系人的消息</label><textarea id="draft" placeholder="还有什么想一起想想的？" rows="2"></textarea><div class="composer-footer"><button class="workspace" id="workspace"><svg aria-hidden="true"><use href="#i-folder"/></svg><span>notes/</span></button><button class="send" id="send" aria-label="发送消息"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button></div></div><div class="compose-hint"><span id="hint">Enter 发送 · Shift Enter 换行</span><span id="draft-state">草稿仅保存在此原型页面</span></div></div>
 </main>

</div>

 <p>防晒、充电器和薄外套记得带。你想先定住宿，还是再把行程放松一点？</p>

<script>
const $=id=>document.getElementById(id);
function sampleMessages(rich=false){return [
 {role:'user',text:'周末想去海边待两天，帮我安排得轻松一点。',time:'10:42'},
 {role:'assistant',text:'好呀。你更想四处逛逛，还是找个地方慢慢待着？',time:'10:42'},
 {role:'user',text:rich?'慢慢待着。看看 notes/trip.md，用表格和图表帮我理一下，先不要改文件。':'慢慢待着。看看 notes/trip.md，别安排太满，也先不要改文件。',time:'10:43'},
 {role:'assistant',kind:rich?'rich':'trip',time:'10:43'}
]}
function sampleWork(status='running'){
 const work={title:'整理旅行资料',status,detail:'正在读取住宿笔记',kind:'trip',events:[{name:'read',target:'notes/trip.md',status:'completed',output:'已读取：周末看海、咖啡、散步；不赶早班车。'},{name:'read',target:'notes/stay.md',status:'running',output:''}],artifact:''};
 if(status==='completed')completeWork(work);
 if(status==='failed'){work.detail='住宿笔记未找到，需要检查文件位置';work.events[1].status='failed';work.events[1].output='文件不存在：notes/stay.md。此前的读取结果已保留。'}
 return work;
}
function completeWork(work){
 work.status='completed';work.events.forEach(event=>{if(event.status==='running'){event.status='completed';event.output='处理完成（设计示例）。'}});
 work.detail='本次工作已完成';
 if(work.kind==='trip'){work.events.push({name:'write',target:'notes/trip-plan.md',status:'completed',output:'已生成行程草稿（设计示例，不写入真实文件）。'});work.detail='已整理 2 份资料，生成了行程草稿';work.artifact='周六：上午出发，午后入住，傍晚看海。\n周日：早午餐、自由散步，下午返程。\n待确认：住宿预算和往返车次。'}
}
const contacts=[{name:'Saki',draft:'',scene:'ready',messages:sampleMessages(),work:null,bound:true,purpose:'日常整理与阅读',directory:'notes/'},{name:'Mio',draft:'帮我整理一下明天想读的资料',scene:'empty',messages:[],work:null,bound:false,purpose:'',directory:''}];
let selected=0,panelKind='',panelOrigin=null,contentOrigin=null,stopTimer=null,toastTimer=null;
const active=()=>contacts[selected];
const icon=name=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const isBusy=c=>['running','stopping'].includes(c.work?.status);
const workLabel=status=>({running:'工作中',stopping:'正在停止',completed:'已完成',interrupted:'已停止',failed:'需要处理'}[status]||'');
function announce(text){$('live').textContent=text}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2200)}
function setTheme(theme){document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===theme)))}
document.addEventListener('click',e=>{const button=e.target.closest('[data-theme-choice]');if(button)setTheme(button.dataset.themeChoice)});
function renderContacts(){
 $('contacts').replaceChildren();contacts.forEach((contact,i)=>{
  const button=document.createElement('button');button.className='contact';button.setAttribute('aria-current',String(i===selected));
  const image=document.createElement('img');image.src='assets/saki-avatar-default.png';image.className='avatar';image.alt='';
  const text=document.createElement('div');text.className='grow';const name=document.createElement('div');name.className='name';name.textContent=contact.name;
  const snippet=document.createElement('div');snippet.className='snippet';snippet.textContent=isBusy(contact)?workLabel(contact.work.status)+' · '+contact.work.title:contact.work?.status==='failed'?'需要处理 · '+contact.work.title:contact.draft?'草稿 · '+contact.draft:contact.scene==='error'?'需要检查启动配置':contact.messages.at(-1)?.text||(contact.messages.length?'要先一起看看住哪里吗？':'新对话');
  text.append(name,snippet);button.append(image,text);button.addEventListener('click',()=>{active().draft=$('draft').value;selected=i;closePanel(false);render();scrollToLatest()});$('contacts').append(button);
 });
}
function renderMessages(){
 $('thread').replaceChildren();active().messages.forEach((message,index)=>{
  const row=document.createElement('article');row.className='message '+message.role;row.setAttribute('aria-label',message.role==='user'?'你的消息':active().name+' 的消息');
  if(message.role==='assistant'){const avatar=document.createElement('img');avatar.src='assets/saki-avatar-default.png';avatar.className='avatar';avatar.alt='';row.append(avatar)}
  const body=document.createElement('div');body.className='message-body';
  if(message.role==='assistant'){const sender=document.createElement('div');sender.className='sender';sender.textContent=active().name;body.append(sender)}
  const bubble=document.createElement('div');bubble.className='bubble';bubble.id='message-'+index;bubble.tabIndex=-1;
  if(['trip','rich'].includes(message.kind))bubble.append($(message.kind+'-reply').content.cloneNode(true));
  else{const text=document.createElement('p');text.style.whiteSpace='pre-wrap';text.textContent=message.text; bubble.append(text)}
  const meta=document.createElement('div');meta.className='message-meta';const time=document.createElement('span');time.textContent=message.time;meta.append(time);
  if(message.role==='assistant'){const copy=document.createElement('button');copy.innerHTML=icon('copy')+'复制';copy.setAttribute('aria-label','复制这条回复');copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(bubble.textContent.trim());toast('已复制回复')}catch{toast('未能访问剪贴板，请直接选择回复文字复制')}});meta.append(copy)}
  bubble.querySelectorAll('[data-expand-content]').forEach(expand=>expand.addEventListener('click',()=>{contentOrigin=expand;const isChart=expand.dataset.expandContent==='chart';const content=bubble.querySelector(isChart?'.chart':'.table-wrap').cloneNode(true);content.querySelectorAll('button').forEach(button=>button.remove());$('content-title').textContent=isChart?'时间分配 · 图表示例':'两天的安排 · 表格详情';$('content-detail').replaceChildren(content);$('content-modal').showModal();$('close-content').focus()}));
  body.append(bubble,meta);row.append(body);$('thread').append(row);
 });
}
function scrollToLatest(){$('scroll').scrollTop=$('scroll').scrollHeight}
function sizeDraft(){$('draft').style.height='auto';$('draft').style.height=Math.min(140,$('draft').scrollHeight)+'px'}
function renderWorkPanel(){
 const work=active().work;
 $('panel-content').innerHTML=work?'<h3 id="work-panel-title"></h3><p class="help" id="work-panel-status"></p><div class="section-title">执行记录</div><ol class="work-steps" id="work-events"></ol><div id="work-result"></div><p class="help">设计模拟 · 记录不读取或修改真实文件。</p>':'<p class="help">还没有工作记录。工作与聊天消息独立保留。</p>';
 if(!work)return;
 $('work-panel-title').textContent=work.title;$('work-panel-status').textContent=workLabel(work.status)+' · '+work.detail;
 work.events.forEach(event=>{const item=document.createElement('li');const details=document.createElement('details');details.className='tool';const summary=document.createElement('summary');summary.textContent=event.name+' · '+event.target+' · '+workLabel(event.status);const output=document.createElement('pre');output.className='tool-output';output.textContent=event.output||'正在执行，尚无结果。';details.append(summary,output);item.append(details);$('work-events').append(item)});
 if(work.artifact){$('work-result').innerHTML='<div class="section-title">产物</div><details class="tool"><summary>notes/trip-plan.md · 查看草稿</summary><pre class="tool-output"></pre></details>';$('work-result').querySelector('pre').textContent=work.artifact}
 if(isBusy(active())){const stop=document.createElement('button');stop.className='pill';stop.textContent=work.status==='stopping'?'正在停止':'停止这项工作';stop.disabled=work.status==='stopping';stop.addEventListener('click',()=>{stopWork();$('close-panel').focus()});$('panel-content').append(stop)}
}
function updateSend(){const c=active();$('send').disabled=isBusy(c)||c.scene==='error'||contacts.some((x,i)=>i!==selected&&isBusy(x))||!c.draft.trim()}
function render(){
 const c=active(),busy=isBusy(c),otherBusy=contacts.some((x,i)=>i!==selected&&isBusy(x)),work=c.work;
 $('workspace').querySelector('span').textContent=c.directory||'默认工作目录';$('contact-name').textContent=c.name;
 $('status-text').textContent=c.scene==='error'?'需要检查启动配置':busy?workLabel(work.status):work?.status==='failed'?'需要处理':'空闲';
 $('status-text').style.color=busy?'var(--success)':c.scene==='error'||work?.status==='failed'?'var(--danger)':'var(--muted)';
 $('draft').value=c.draft;$('draft').placeholder='给 '+c.name+' 发消息…';sizeDraft();
 $('error-banner').hidden=c.scene!=='error';$('empty').hidden=!!c.messages.length;$('date-label').hidden=!c.messages.length;
 $('scene').value=c.scene;$('finish-demo').hidden=work?.status!=='running';$('speak-demo').hidden=work?.status!=='running';
 $('work-strip').hidden=!work;
 if(work){$('work-title').textContent=work.title;$('work-state').textContent=workLabel(work.status);$('work-detail').textContent=work.detail;$('work-indicator').className='work-indicator '+work.status}
 $('stop-work').hidden=!busy;$('stop-work').disabled=work?.status==='stopping';$('stop-work').textContent=work?.status==='stopping'?'停止中':'停止';
 updateSend();
 $('hint').textContent=c.scene==='error'?'启动恢复后才可发送；草稿仍可编辑':otherBusy?'另一个联系人正在工作，暂不可发送':busy?'正在工作，可先写下要说的话':'Enter 发送 · Shift Enter 换行';
 renderMessages();renderContacts();if(panelKind==='work'&&$('panel').open)renderWorkPanel();
}
function changeScene(scene){
 clearTimeout(stopTimer);contacts.forEach(c=>{if(isBusy(c)){c.work.status='interrupted';c.work.detail='设计场景已切换';c.work.events.forEach(event=>{if(event.status==='running')event.status='interrupted'})}});
 const c=active();c.scene=scene;c.messages=scene==='empty'?[]:sampleMessages(scene==='rich');c.bound=scene!=='empty';c.work=null;
 if(['working','speaking','done','blocked'].includes(scene)){
  c.messages=sampleMessages().slice(0,3);c.messages[2].text='帮我把旅行资料整理成草稿，你先处理，不用每一步都回复我。';
  c.work=sampleWork(scene==='done'?'completed':scene==='blocked'?'failed':'running');
  if(scene==='speaking')c.messages.push({role:'assistant',text:'我已经理好交通资料了，住宿部分还在核对，我会继续整理。',time:'10:44'});
 }
 closePanel(false);render();if(scene==='rich')$('message-3').closest('.message').scrollIntoView({block:'start'});else scrollToLatest();announce('设计场景：'+$('scene').selectedOptions[0].textContent);
}
$('scene').addEventListener('change',e=>changeScene(e.target.value));
$('draft').addEventListener('input',()=>{active().draft=$('draft').value;renderContacts();updateSend();sizeDraft()});
function send(){
 if($('send').disabled)return;const c=active();
 c.messages.push({role:'user',text:c.draft,time:'刚刚'});c.work={title:'处理这次委托',status:'running',detail:'正在处理你的消息',kind:'user',events:[{name:'处理委托',target:'模拟运行',status:'running',output:''}],artifact:''};c.draft='';c.scene='working';c.bound=true;render();scrollToLatest();$('draft').focus();announce('工作已开始，尚未收到 Agent 消息');
}
function stopWork(){
 const c=active();if(c.work?.status!=='running')return;c.work.status='stopping';c.work.detail='已请求停止，等待执行结束';render();announce('已请求停止工作');
 stopTimer=setTimeout(()=>{c.work.status='interrupted';c.work.detail='工作已停止，已完成的步骤和消息仍保留';c.work.events.forEach(event=>{if(event.status==='running'){event.status='interrupted';event.output='执行已停止，结果待检查。'}});render();announce('模拟工作已停止')},650);
}
$('stop-work').addEventListener('click',stopWork);
$('finish-demo').addEventListener('click',()=>{const c=active();if(c.work?.status!=='running')return;completeWork(c.work);c.scene='done';render();announce('模拟工作已完成，没有新增聊天消息')});
$('speak-demo').addEventListener('click',()=>{const c=active();if(c.work?.status!=='running')return;c.messages.push({role:'assistant',text:'我已经整理好一部分资料，还在继续处理。这里是一条模拟发送的消息。',time:'刚刚'});c.scene='speaking';render();scrollToLatest();announce('收到 Agent 消息，工作仍在继续')});
$('send').addEventListener('click',send);$('draft').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send()}});
$('add-contact').addEventListener('click',()=>{active().draft=$('draft').value;contacts.push({name:'新联系人 '+contacts.length,draft:'',scene:'empty',messages:[],work:null,bound:false,purpose:'',directory:''});selected=contacts.length-1;closePanel(false);render();$('draft').focus();announce('已添加联系人')});
function closeContent(){$('content-modal').close();contentOrigin?.focus()}
$('close-content').addEventListener('click',closeContent);$('content-modal').addEventListener('cancel',e=>{e.preventDefault();closeContent()});
function closePanel(restore=true){if(!$('panel').open)return;$('panel').close();$('app').classList.remove('panel-open');['work-button','history-button','settings-button'].forEach(id=>$(id).setAttribute('aria-expanded','false'));if(restore&&panelOrigin)panelOrigin.focus();panelKind=''}
function openPanel(kind,origin){
 if(panelKind===kind&&$('panel').open){closePanel();return}closePanel(false);panelKind=kind;panelOrigin=origin;$('app').classList.add('panel-open');
 $('panel-title').textContent={work:'工作',settings:'联系人设置',history:'历史记录',diagnostics:'启动诊断'}[kind];
 if(kind==='work'){
  $('work-button').setAttribute('aria-expanded','true');renderWorkPanel();
 }else if(kind==='settings'){
  $('settings-button').setAttribute('aria-expanded','true');
  $('panel-content').innerHTML='<label for="profile-name">名称</label><input class="field" id="profile-name"><label for="purpose">用途</label><input class="field" id="purpose"><label for="directory">工作目录</label><input class="field" id="directory"><p class="help">'+(active().bound?'此联系人已绑定会话。用途与工作目录在首次发送时确定，名称可单独修改。':'这些设置是可选的，将在首次发送时使用。')+'</p><div class="section-title">应用外观</div><div class="theme-options"><button data-theme-choice="moon"><span class="swatch"></span>Moon</button><button data-theme-choice="dawn"><span class="swatch dawn"></span>Dawn</button></div><p class="help">应用级预览，同时应用到所有联系人。</p><div class="section-title">模型配置</div><p class="help">模型由应用启动时的配置决定。</p>';
  $('purpose').value=active().purpose;$('directory').value=active().directory;for(const [id,key] of [['purpose','purpose'],['directory','directory']]){$(id).disabled=active().bound;$(id).addEventListener('input',()=>{active()[key]=$(id).value;if(key==='directory')$('workspace').querySelector('span').textContent=active().directory||'默认工作目录'})}$('profile-name').value=active().name;$('profile-name').addEventListener('input',()=>{active().name=$('profile-name').value||'未命名联系人';$('contact-name').textContent=active().name;renderContacts();document.querySelectorAll('.sender').forEach(sender=>sender.textContent=active().name)});setTheme(document.documentElement.dataset.theme);
 }else if(kind==='history'){
  $('history-button').setAttribute('aria-expanded','true');
  $('panel-content').innerHTML='<label for="history-search">查找这段对话</label><input class="field" id="history-search" type="search" placeholder="输入关键词"><p class="help">本原型只有一条示例记录。</p><button class="history-row" id="history-result"><strong>周末去看海</strong><span>今天 · 一份轻松的两日安排</span></button><p class="help" id="no-results" hidden>没有匹配的记录。</p>';
  const hasHistory=active().messages.length>0;const title=active().messages.find(message=>message.role==='user')?.text||'';$('history-result').querySelector('strong').textContent=title;$('history-result').querySelector('span').textContent='今天 · '+active().messages.length+' 条消息';
  $('history-result').hidden=!hasHistory;if(!hasHistory){$('no-results').hidden=false;$('no-results').textContent='此联系人还没有历史记录。'}$('history-search').addEventListener('input',()=>{const found=hasHistory&&active().messages.some(message=>(message.text||$(message.kind+'-reply')?.content.textContent||'').includes($('history-search').value.trim()));$('history-result').hidden=!found;$('no-results').hidden=found});
  $('history-result').addEventListener('click',()=>{closePanel(false);const target=$('message-0');target.scrollIntoView({block:'start'});target.focus();announce('已定位到这段对话的第一条消息')});
 }else{
  $('panel-content').innerHTML='<p class="help">以下为设计示例，不读取本机配置。</p><div class="section-title">失败阶段</div><h3>定位运行程序</h3><p class="help">应用尚未建立运行连接，任务未发送。</p><div class="section-title">可执行的下一步</div><ol class="help"><li>确认应用安装包内包含 Saki-runtime。</li><li>自行构建时，核对运行程序位置。</li><li>修正配置后重新启动应用。</li></ol><div class="section-title">已保留</div><p class="help">本页草稿可以继续编辑。真实应用的草稿与历史恢复以存储和 Runtime 已确认的数据为准。</p>';
 }
 if($('app').classList.contains('wide'))$('panel').show();else $('panel').showModal();
 $('close-panel').focus();
}
$('work-button').addEventListener('click',e=>openPanel('work',e.currentTarget));$('view-work').addEventListener('click',e=>openPanel('work',e.currentTarget));$('history-button').addEventListener('click',e=>openPanel('history',e.currentTarget));$('settings-button').addEventListener('click',e=>openPanel('settings',e.currentTarget));$('appearance').addEventListener('click',e=>openPanel('settings',e.currentTarget));$('workspace').addEventListener('click',e=>openPanel('settings',e.currentTarget));$('diagnostics').addEventListener('click',e=>openPanel('diagnostics',e.currentTarget));$('close-panel').addEventListener('click',()=>closePanel());$('panel').addEventListener('cancel',e=>{e.preventDefault();closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('panel').open){e.preventDefault();closePanel()}});
function layout(){const rect=$('app').getBoundingClientRect();$('app').style.setProperty('--panel-top',rect.top+'px');$('app').style.setProperty('--panel-right',(innerWidth-rect.right)+'px');$('app').style.setProperty('--panel-height',rect.height+'px');const wide=rect.width>=1120;if(wide!==$('app').classList.contains('wide')){closePanel(false);$('app').classList.toggle('wide',wide)}}
$('frame').addEventListener('change',e=>{closePanel(false);document.documentElement.style.setProperty('--frame',e.target.value+'px');layout()});new ResizeObserver(layout).observe($('app'));window.addEventListener('resize',layout);
render();layout();scrollToLatest();
