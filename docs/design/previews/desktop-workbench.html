<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nagi · 工作台设计预览</title>
    <style>
      :root {
        color-scheme: light;
        --page: #e9ecea;
        --surface: #ffffff;
        --rail: #f5f6f5;
        --panel: #f8f9f8;
        --well: #eff2f0;
        --hover: #e8ede9;
        --line: #dde3df;
        --ink: #252c28;
        --muted: #626c65;
        --accent: #365e4d;
        --on-accent: #ffffff;
        --tint: #e8f0ea;
        --warning: #8b542d;
        --warning-bg: #f7ede3;
        --focus: #437762;
        --shadow: 0 18px 60px #20302814;
        --bubble: #f2f4f2;
      }
      [data-theme="night"] {
        color-scheme: dark;
        --page: #131714;
        --surface: #202622;
        --rail: #1a201c;
        --panel: #1d231f;
        --well: #2a332d;
        --hover: #354239;
        --line: #3b473f;
        --ink: #edf1eb;
        --muted: #adb8af;
        --accent: #b7d1bd;
        --on-accent: #203328;
        --tint: #33473a;
        --warning: #edbb8c;
        --warning-bg: #3b3027;
        --focus: #b7d1bd;
        --shadow: 0 18px 60px #0004;
        --bubble: #2a332d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
        border-radius: 7px;
        transition:
          background-color 120ms ease,
          color 120ms ease;
      }
      button:hover {
        background: var(--hover);
      }
      button:active {
        background: var(--line);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
      button svg {
        pointer-events: none;
      }
      svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      [hidden] {
        display: none !important;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.5;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      a {
        color: var(--accent);
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .between {
        justify-content: space-between;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .icon {
        width: 32px;
        height: 32px;
        display: inline-grid;
        place-items: center;
      }
      .quiet,
      .soft,
      .primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 32px;
        padding: 6px 10px;
        font-size: 13px;
        font-weight: 500;
      }
      .quiet {
        color: var(--muted);
      }
      .soft {
        background: var(--well);
        color: var(--ink);
      }
      .primary {
        background: var(--accent);
        color: var(--on-accent);
      }
      .primary:hover {
        background: var(--accent);
        filter: brightness(0.92);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--accent);
        font-size: 12px;
      }
      .warning {
        color: var(--warning);
      }
      .chevron {
        color: var(--muted);
        width: 15px;
      }
      .proto-bar {
        max-width: 1440px;
        margin: 22px auto 16px;
        padding: 0 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .proto-bar strong {
        font-size: 14px;
        letter-spacing: 0.2px;
        color: var(--ink);
        margin-right: 10px;
      }
      .proto-tools {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .proto-tools select {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        padding: 5px 8px;
        min-height: 30px;
        font-size: 12px;
      }
      .proto-footer {
        max-width: 1380px;
        padding: 12px 30px;
        margin: auto;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .skip {
        position: fixed;
        top: -100px;
        z-index: 100;
        background: var(--surface);
        padding: 12px;
      }
      .skip:focus {
        top: 8px;
      }
      .app {
        --left: 200px;
        --right: 340px;
        position: relative;
        width: min(var(--frame, 1380px), calc(100% - 60px));
        height: min(840px, calc(100dvh - 122px));
        min-height: 560px;
        margin: auto;
        display: grid;
        grid-template-columns: var(--left) 1px minmax(0, 1fr);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 13px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .app.docked.work-open {
        grid-template-columns: var(--left) 1px minmax(480px, 1fr) 1px var(
            --right
          );
      }
      .rail {
        grid-column: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 18px 10px 10px;
        background: var(--rail);
      }
      .brand {
        height: 42px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand strong {
        font-size: 19px;
        letter-spacing: -0.5px;
      }
      .brand-mark {
        width: 22px;
        height: 22px;
        color: var(--accent);
      }
      .search {
        height: 34px;
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 16px 5px 14px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--muted);
        background: var(--surface);
      }
      .search input {
        border: 0;
        background: none;
        outline: none;
        min-width: 0;
        width: 100%;
        font-size: 13px;
      }
      .search:focus-within {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .rail-heading {
        padding: 0 7px 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .rail-heading select {
        border: 0;
        background: none;
        max-width: 120px;
        font-size: 12px;
        color: var(--muted);
      }
      .contacts {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .contact {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 11px 9px;
        text-align: left;
        border-radius: 8px;
        margin-bottom: 3px;
      }
      .contact[aria-current="true"] {
        background: var(--hover);
      }
      .contact strong {
        font-size: 14px;
        font-weight: 550;
        display: block;
      }
      .contact small {
        display: block;
        font-size: 12px;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        color: var(--muted);
        margin-top: 2px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        object-fit: cover;
        background: var(--well);
        flex: none;
      }
      .avatar.letter {
        display: grid;
        place-items: center;
        font-weight: 500;
        font-size: 16px;
        color: var(--accent);
        background: var(--tint);
      }
      .rail-bottom {
        padding: 10px 5px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
      .splitter {
        position: relative;
        grid-column: 2;
        background: var(--line);
        cursor: col-resize;
        z-index: 3;
        touch-action: none;
      }
      .splitter::after {
        content: "";
        position: absolute;
        inset: 0 -4px;
      }
      .splitter:hover,
      .splitter:focus-visible {
        background: var(--focus);
      }
      #right-split {
        grid-column: 4;
      }
      .main {
        grid-column: 3;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .main-head {
        height: 76px;
        flex: none;
        padding: 0 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
      }
      .main-head .avatar {
        width: 35px;
        height: 35px;
      }
      .identity {
        flex: 1;
        min-width: 0;
      }
      .identity p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .head-actions {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .head-actions .soft[aria-expanded="true"] {
        background: var(--tint);
        color: var(--accent);
      }
      .conversation {
        flex: 1;
        min-height: 0;
        overflow: auto;
        scrollbar-width: thin;
        padding: 28px 28px 12px;
      }
      .reading {
        max-width: 710px;
        margin: auto;
      }
      .date {
        font-size: 12px;
        text-align: center;
        color: var(--muted);
        margin: 0 0 25px;
      }
      .message {
        margin-bottom: 22px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .message.user {
        align-items: flex-end;
      }
      .bubble {
        max-width: 90%;
        padding: 13px 16px;
        border-radius: 4px 15px 15px 15px;
        background: var(--bubble);
        font-size: 15px;
        line-height: 1.8;
        overflow-wrap: anywhere;
      }
      .user .bubble {
        background: var(--tint);
        border-radius: 15px 4px 15px 15px;
        max-width: 82%;
      }
      .message-meta {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 5px 2px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .message-meta button {
        padding: 2px 5px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 24px;
      }
      .message-meta svg {
        width: 13px;
        height: 13px;
      }
      .message p + p {
        margin-top: 12px;
      }
      .bubble h3 {
        margin-bottom: 8px;
        font-size: 15px;
      }
      .bubble table {
        border-collapse: collapse;
        width: 100%;
        table-layout: fixed;
        font-size: 13px;
        margin: 12px 0;
      }
      .bubble th,
      .bubble td {
        padding: 7px 8px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .bubble th {
        font-weight: 600;
      }
      .bubble ul {
        padding-left: 20px;
        margin: 8px 0;
      }
      .mini-bars {
        margin-top: 12px;
        display: grid;
        gap: 8px;
        font-size: 12px;
      }
      .bar-row {
        display: grid;
        grid-template-columns: 60px 1fr 42px;
        gap: 8px;
        align-items: center;
      }
      .bar {
        height: 5px;
        background: var(--line);
        border-radius: 5px;
      }
      .bar i {
        height: 100%;
        display: block;
        border-radius: 5px;
        background: var(--accent);
      }
      .empty {
        margin: 16vh auto 30px;
        max-width: 320px;
        text-align: center;
      }
      .empty .avatar {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
      }
      .empty p {
        margin-top: 8px;
        font-size: 14px;
        color: var(--muted);
        line-height: 1.8;
      }
      .composer-wrap {
        flex: none;
        padding: 10px 28px 18px;
      }
      .composer {
        max-width: 710px;
        margin: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 13px;
        box-shadow: 0 3px 12px #20302806;
      }
      .composer:focus-within {
        border-color: var(--focus);
        box-shadow: 0 0 0 1px var(--focus);
      }
      .composer textarea {
        border: 0;
        resize: none;
        background: none;
        width: 100%;
        height: 82px;
        padding: 15px 16px 6px;
        outline: none;
        font-size: 15px;
        line-height: 1.6;
      }
      .composer textarea::placeholder {
        color: var(--muted);
      }
      .composer-bottom {
        padding: 3px 10px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .model-select {
        background: var(--well);
        border: 0;
        border-radius: 7px;
        padding: 6px 8px;
        font-size: 12px;
        max-width: 220px;
        min-width: 0;
      }
      .composer-hint {
        max-width: 710px;
        margin: 7px auto 0;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .alert-inline {
        max-width: 710px;
        margin: 0 auto 12px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--warning-bg);
        color: var(--warning);
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .work {
        margin: 0;
        padding: 0;
        border: 0;
        background: var(--panel);
        color: var(--ink);
        max-height: none;
        max-width: none;
        width: var(--right, 340px);
      }
      .work[open] {
        display: flex;
        flex-direction: column;
        animation: enter 140ms ease-out;
      }
      .docked .work {
        grid-column: 5;
        grid-row: 1;
        position: relative;
        height: 100%;
        min-height: 0;
      }
      .app:not(.docked) .work {
        position: fixed;
        left: auto;
        right: var(--panel-right, 30px);
        top: var(--panel-top, 64px);
        height: var(--panel-height, 720px);
        width: min(360px, calc(100vw - 40px));
        border-radius: 0 12px 12px 0;
        box-shadow: -12px 0 44px #0002;
      }
      .work::backdrop {
        background: #16201a45;
      }
      .work-head {
        height: 76px;
        flex: none;
        padding: 0 18px 0 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }
      .work-head h2 {
        font-size: 15px;
      }
      .work-head p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .work-body {
        padding: 18px 20px 24px;
        overflow: auto;
        min-height: 0;
        flex: 1;
        scrollbar-width: thin;
      }
      .tabs {
        display: flex;
        background: var(--well);
        padding: 3px;
        border-radius: 7px;
        margin-bottom: 22px;
      }
      .tabs button {
        flex: 1;
        padding: 5px 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .tabs button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 3px #0001;
      }
      .section-heading {
        margin: 23px 0 9px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-heading:first-child {
        margin-top: 0;
      }
      .group {
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: var(--surface);
      }
      .task-row {
        width: 100%;
        padding: 13px 12px;
        text-align: left;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border-radius: 0;
      }
      .task-row + .task-row {
        border-top: 1px solid var(--line);
      }
      .task-row > .task-symbol {
        margin-top: 3px;
        width: 18px;
        height: 18px;
        color: var(--muted);
      }
      .task-row strong {
        font-size: 14px;
        font-weight: 550;
        display: block;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .task-row small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .task-row .chevron {
        margin-top: 5px;
      }
      .task-row .status {
        margin-top: 7px;
      }
      .attention-row {
        background: var(--warning-bg);
      }
      .group .attention-row:hover {
        background: var(--hover);
      }
      .work-toolbar {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .work-toolbar select {
        background: none;
        border: 0;
        font-size: 12px;
        color: var(--muted);
        max-width: 160px;
        padding: 5px 0;
      }
      .work-foot {
        padding: 10px 15px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .back {
        display: flex;
        width: fit-content;
        gap: 5px;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
        margin: -4px 0 20px;
        padding: 5px 0;
        min-height: 30px;
      }
      .detail-title {
        font-size: 20px;
        line-height: 1.5;
        letter-spacing: -0.3px;
        margin: 10px 0;
      }
      .description {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.75;
      }
      .notice {
        margin-top: 18px;
        padding: 13px 14px;
        background: var(--warning-bg);
        border-radius: 8px;
        font-size: 13px;
        color: var(--warning);
        line-height: 1.7;
      }
      .notice strong {
        display: block;
        margin-bottom: 3px;
      }
      .detail-action {
        margin: 14px 0 22px;
        width: 100%;
        min-height: 36px;
      }
      .result-file {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 11px;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .result-file > svg {
        color: var(--accent);
        width: 22px;
        height: 22px;
      }
      .result-file strong {
        display: block;
        font-size: 13px;
        font-weight: 550;
      }
      .result-file small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }
      .disclosure {
        border-top: 1px solid var(--line);
        margin-top: 18px;
        padding-top: 3px;
      }
      .disclosure summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 0;
        font-size: 13px;
        font-weight: 500;
      }
      .disclosure summary::-webkit-details-marker {
        display: none;
      }
      .disclosure[open] summary .chevron {
        transform: rotate(90deg);
      }
      .requirements {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .requirements li {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 9px 0;
        font-size: 13px;
        line-height: 1.6;
      }
      .requirements svg {
        width: 16px;
        height: 16px;
        margin-top: 3px;
        color: var(--muted);
      }
      .requirements .met svg {
        color: var(--accent);
      }
      .requirements small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }
      .run-line {
        padding: 10px 0;
        font-size: 13px;
        line-height: 1.6;
      }
      .run-line p {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .timeline {
        padding-left: 16px;
        margin: 0;
        list-style: none;
        border-left: 1px solid var(--line);
      }
      .timeline li {
        position: relative;
        margin: 0 0 25px;
      }
      .timeline li:before {
        content: "";
        position: absolute;
        left: -20px;

        }
        if (b.dataset.reader) showReader(b.dataset.reader, b);
        if (b.dataset.board) {
          $("modal").close();
          showBoard(b.dataset.board);
        }
        if (b.hasAttribute("data-close")) closeModal();
        if (b.dataset.action) {
          const t = tasks.find((t) => t.id === b.dataset.id);
          if (b.dataset.action === "reply") {
            closeWork(false);
            current().draft = `关于「${t.title}」，${current().draft}`;
            $("draft").value = current().draft;
            $("draft").focus();
            updateSend();
          }
          if (b.dataset.action === "start") {
            t.state = "doing";
            t.run = "running";
            t.summary = "已开始处理（模拟）";
            t.updated = "刚刚";
            renderHeader();
            renderContacts();
            renderWork();
            announce("模拟开始处理，未调用模型");
          }
          if (b.dataset.action === "stop") {
            t.run = "stopped";
            t.summary = "已暂停，已有内容保留";
            t.events.push("刚刚 · 已停止（模拟终态）");
            renderHeader();
            renderContacts();
            renderWork();
            announce("模拟执行已停止，事项仍未完成");
          }
        }
        if (b.dataset.copy !== undefined) {
          try {
            await navigator.clipboard.writeText(
              b.closest(".message").querySelector(".bubble").innerText,
            );
            announce("消息已复制");
          } catch {
            announce("无法访问剪贴板，可选中文字复制");
          }
        }
        if (b.id === "copy-result") {
          try {
            await navigator.clipboard.writeText(
              $("modal-content")
                .querySelector(".reader")
                .innerText.replace("复制正文", ""),
            );
            announce("正文已复制");
          } catch {
            announce("无法访问剪贴板，可选中文字复制");
          }
        }
      });
      $("simulate").addEventListener("click", () => {
        const t = currentTasks().find((t) => t.run === "running");
        if (!t) return;
        t.run = "completed";
        t.summary = t.result
          ? "初稿已保存，仍有要求待满足"
          : "本次执行已结束，要求仍需核实";
        t.events.push("刚刚 · 本次执行结束（模拟）");
        t.updated = "刚刚";
        renderHeader();
        renderContacts();
        if ($("work").open) renderWork();
        announce("本次执行结束，事项仍在进行中；没有新增聊天消息");
      });
      $("scene").addEventListener("change", (e) => {
        scene = e.target.value;
        render();
      });
      $("theme").addEventListener(
        "change",
        (e) => (document.documentElement.dataset.theme = e.target.value),
      );
      $("frame").addEventListener("change", (e) => {
        $("app").style.setProperty("--frame", e.target.value + "px");
        layout();
      });
      $("board").addEventListener("click", () => showBoard());
      $("schedule").addEventListener("click", () => showBoard("schedule"));
      $("new-task").addEventListener("click", newTask);
      $("contact-settings").addEventListener("click", openSettings);
      $("appearance").addEventListener("click", () =>
        showModal(
          "应用外观",
          '<p class="muted">预览中的外观会应用到整个工作台。</p><div class="tabs"><button data-theme-choice="paper">浅色</button><button data-theme-choice="night">深色</button></div>',
        ),
      );
      $("history").addEventListener("click", () =>
        showModal(
          "对话历史",
          `<p class="view-note">${escapeHTML(current().name)} 的对话</p>${current().messages.length ? '<button class="task-row" id="history-jump">' + icon("history") + '<span class="grow"><strong>今天的对话</strong><small>' + current().messages.length + " 条消息 · 回到最早一条</small></span>" + icon("chevron") + "</button>" : "<p>还没有对话记录。</p>"}`,
        ),
      );
      $("add-contact").addEventListener("click", () =>
        showModal(
          "添加联系人",
          '<form id="contact-form"><label for="new-name">名称</label><input id="new-name" class="field" required placeholder="给这位搭档起个名字"><label for="new-purpose">用途</label><input id="new-purpose" class="field" placeholder="例如：一起阅读和整理资料"><div class="form-actions"><button type="button" class="quiet" data-close>取消</button><button class="primary">添加联系人</button></div></form>',
        ),
      );
      $("diagnostics").addEventListener("click", () =>
        showModal(
          "连接诊断",
          '<p>示例状态：Runtime 连接在恢复会话时断开。</p><p class="muted">草稿已保留。真实产品应显示具体失败原因，并提供重新连接入口；本预览不启动进程。</p>',
        ),
      );
      $("modal-content").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b?.dataset.themeChoice) {
          document.documentElement.dataset.theme = b.dataset.themeChoice;
          $("theme").value = b.dataset.themeChoice;
          closeModal();
        }
        if (b?.id === "history-jump") {
          closeModal();
          $("conversation").scrollTop = 0;
          announce("已回到这段对话的开头");
        }
      });
      $("modal-content").addEventListener("submit", (e) => {
        e.preventDefault();
        if (e.target.id === "contact-form") {
          const id = "contact-" + Date.now();
          contacts.push({
            id,
            name: $("new-name").value.trim(),
            description: $("new-purpose").value.trim() || "新的搭档",
            avatar: false,
            archived: false,
            draft: "",
            messages: [],
          });
          selected = id;
          selectedTask = null;
          $("contact-filter").value = "active";
          $("contact-search").value = "";
          closeModal();
          render();
          $("draft").focus();
        }
        if (e.target.id === "settings-form") {
          current().name = $("name").value.trim();
          current().description = $("purpose").value.trim();
          closeModal();
          render();
          announce("预览中的联系人已更新");
        }
        if (e.target.id === "task-form") {
          tasks.push({
            id: "task-" + Date.now(),
            contact: selected,
            title: $("task-title").value.trim(),
            state: "todo",
            run: "idle",
            summary: "还没有开始",
            goal: $("task-goal").value.trim(),
            date: "",
            updated: "刚刚",
            result: "",
            requirements: [[$("task-goal").value.trim(), false, "尚未开始"]],
            events: ["刚刚 · 记下这件事"],
          });
          filter = "open";
          selectedTask = null;
          workspaceView = "tasks";
          closeModal();
          renderHeader();
          renderWork();
          announce("已记为待办，尚未启动 Agent");
        }
      });
      window.addEventListener("resize", layout);
      render();
      layout();
    </script>
  </body>
</html>
