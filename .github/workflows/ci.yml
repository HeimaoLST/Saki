name: CI

on:
  pull_request:
  push:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  runtime:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
          rustc --version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pure Runtime dependency boundary
        run: |
          cargo tree --locked --prefix none --format '{p}' > "$RUNNER_TEMP/runtime-dependencies.txt"
          if grep -E '^(ratatui|crossterm|termina|arboard|syntect) ' "$RUNNER_TEMP/runtime-dependencies.txt"; then
            echo "::error::Saki runtime must not compile terminal UI dependencies."
            exit 1
          fi
      - name: Runtime formatting and static checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Runtime tests
        run: cargo test --locked --all-targets
      - name: Build standalone runtime
        run: cargo build --locked --release --bin Saki
      - name: Real-process stdio contract
        timeout-minutes: 5
        run: python3 examples/runtime_stdio.py --self-test --binary target/release/Saki
      - name: Stage traceable runtime artifact
        env:
          SAKI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/package-runtime.py --binary target/release/Saki \
            --output "$RUNNER_TEMP/saki-runtime-artifact"
      - uses: actions/upload-artifact@v7
        id: runtime-artifact
        with:
          name: saki-runtime-aarch64-apple-darwin-${{ github.event.pull_request.head.sha || github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/saki-runtime-artifact/*
          if-no-files-found: error
          archive: true
          retention-days: 90
      - name: Artifact identity for consumer pins
        env:
          ARTIFACT_ID: ${{ steps.runtime-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.runtime-artifact.outputs.artifact-digest }}
        run: |
          echo "artifact_id=$ARTIFACT_ID archive_sha256=$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/saki-runtime-artifact/manifest.json" >> "$GITHUB_STEP_SUMMARY"
  python:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python CI support tests
        run: |
          python3 - <<'PYTHON'
          import unittest
          suite = unittest.TestLoader().discover("scripts", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"DISCOVERED {result.testsRun} tests")
          raise SystemExit(0 if result.testsRun and result.wasSuccessful() else 1)
          PYTHON
  ci-required:
    if: always()
    needs: [runtime, python]
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - name: Require every Saki job
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          echo "runtime=$RUNTIME_RESULT python=$PYTHON_RESULT"
          test "$RUNTIME_RESULT" = success
          test "$PYTHON_RESULT" = success
