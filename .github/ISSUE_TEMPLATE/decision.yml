name: 决策 / RFC
description: 架构、协议或跨 agent 边界的决策（type:decision）
title: "[decision] "
labels: ["type:decision", "status:triage", "needs:design"]
body:
  - type: markdown
    attributes:
      value: |
        > PM 在 triage→ready 前补 Spec 固定评论/版本与执行路径；设计结论仍由受影响业务线用 review/decision 表达，不用接单 ack。
        > 协作协议见根目录 `AGENTS.md` §9。新增跨业务线公共契约或不兼容变更先走 RFC；受影响业务线用 `KIND: review`（APPROVE/REQUEST-CHANGES）或 `KIND: decision` 给出设计结论，确认后再拆实施任务。`KIND: ack` 只用于接单/通知，不是设计批准。不改变公共契约的局部维护走普通 PR。
        > 是否需要人类确认见下方字段：只有产品方向／安全／权限／费用等需人类拍板时才由人类确认。（本模板默认 `status:triage`，`agent:*`／`priority:*` 由 `agent:pm` 分诊补齐。）
        > 决策结论最终必须沉淀到 `docs/design/`；本 issue 承载当前 Spec、讨论与证据，不替代长期事实。

  - type: dropdown
    id: from_agent
    attributes:
      label: 发起方业务线（FROM）
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
        - 人类
    validations:
      required: true

  - type: input
    id: from_instance
    attributes:
      label: 发起方实例 ID（FROM）
      description: 业务线内的唯一实例名，例如 runtime#kira；人类填姓名
      placeholder: runtime#kira
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景与问题
      description: 要决策什么？不决策会卡住什么？引用已有文档与证据
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 候选方案
      description: 每个方案写动机、优点、缺点、成本、迁移方式、回滚方式
      placeholder: |
        ### 方案 A: ...
        - 优点:
        - 缺点:
        - 迁移/回滚:

        ### 方案 B: ...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: 涉及路径、agent、文档、测试与用户可见行为
    validations:
      required: true

  - type: checkboxes
    id: acks
    attributes:
      label: 需要哪些业务线给出设计结论（KIND review/decision，非接单 ack）
      options:
        - label: agent:runtime
        - label: agent:tui
        - label: agent:gui
        - label: agent:qa
        - label: agent:pm

  - type: input
    id: deadline
    attributes:
      label: 决策截止时间
      placeholder: 例如 2026-11-01，或「阻塞 issue #N 前」
    validations:
      required: true

  - type: dropdown
    id: human
    attributes:
      label: 是否需要人类确认
      options:
        - 是（产品方向 / 密钥 / 权限 / 费用）
        - 否（在已授权任务范围内，取得设计结论后实施；接单 ack 不等于批准）
    validations:
      required: true
