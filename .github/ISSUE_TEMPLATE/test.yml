name: 测试 / 验收请求
description: 需要补充或执行测试验证（type:test）
title: "[test] "
labels: ["type:test", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        > 协作协议见根目录 `AGENTS.md` §10。测试覆盖真实行为、非平凡不变量与边界；并发优先受控协调，不用无意义的 sleep 碰运气。简单机械改动不强制新增测试。
        > 本模板用于独立测试／QA 任务。主 agent 给自己的子 agent 分派核查时使用 tmux，由主 agent 汇总真实评审身份、候选 SHA、证据和限制；子 agent 不重复认领或逐条发 GitHub 评论。

  - type: dropdown
    id: from_agent
    attributes:
      label: 请求方业务线（FROM）
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
        - 人类
    validations:
      required: true

  - type: input
    id: from_instance
    attributes:
      label: 请求方实例 ID（FROM）
      description: 业务线内的唯一实例名，例如 runtime#kira；人类填姓名
      placeholder: runtime#kira
    validations:
      required: true

  - type: dropdown
    id: to_agent
    attributes:
      label: 执行方业务线（TO）
      description: 单模块测试归对应模块业务线；跨模块 / 端到端 / PTY 验收归 agent:qa
      options:
        - agent:qa
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:pm
    validations:
      required: true

  - type: input
    id: to_instance
    attributes:
      label: 指定实例（TO，可选）
      description: 想点名某个实例就填写；留空表示该业务线任意实例均可接手
      placeholder: qa#rhea
    validations:
      required: false

  - type: input
    id: subject
    attributes:
      label: 被测行为
      description: 一句话描述要验证的事实
      placeholder: 同一 session 运行中收到新消息时按既定策略处理
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 为什么需要
      description: 现状缺陷 / 覆盖缺口 / 回归防护 / 发布前验收
    validations:
      required: true

  - type: textarea
    id: scenarios
    attributes:
      label: 验收场景（确定性步骤）
      description: 每个场景写清输入、步骤、期望观察结果；避免依赖偶然顺序
      placeholder: |
        1. 构造 ...（受控 mock）
        2. 触发 ...
        3. 断言事件顺序为 ...
    validations:
      required: true

  - type: textarea
    id: mock
    attributes:
      label: mock 边界与替代方案
      description: 哪些依赖可以 mock，哪些必须真实（真实模型 / 真实 PTY / 真实文件系统）
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 期望测试位置
      description: 例如 tests/tools/mod.rs（runtime 模块测试）；跨模块／PTY 验收的位置和范围在 issue 中明确，不按 tests/ 目录名直接推定归属
      placeholder: tests/tools/mod.rs
    validations:
      required: true

  - type: checkboxes
    id: needs
    attributes:
      label: 环境要求
      options:
        - label: 仅离线即可
        - label: 需要真实模型（请在完成后注明模型 ID）
        - label: 需要真实 PTY / tmux
        - label: 需要 Go 环境（desktop）

  - type: textarea
    id: refs
    attributes:
      label: 关联引用
      description: 相关 issue / PR / commit / 文档链接，没有就写「无」
    validations:
      required: true
