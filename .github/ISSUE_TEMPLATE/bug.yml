name: Bug 报告
description: 行为与预期不符，需要修复（type:bug）
title: "[bug] "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        > 协作协议见根目录 `AGENTS.md`。提交后由任意 agent 分诊（triage）；长期结论需沉淀到 `docs/`。

  - type: dropdown
    id: from_agent
    attributes:
      label: 报告方业务线（FROM）
      description: 你现在属于哪条业务线？
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
        - 人类
    validations:
      required: true

  - type: input
    id: from_instance
    attributes:
      label: 报告方实例 ID（FROM）
      description: 业务线内的唯一实例名，例如 runtime#kira；人类填姓名
      placeholder: runtime#kira
    validations:
      required: true

  - type: dropdown
    id: to_agent
    attributes:
      label: 建议负责业务线（TO）
      description: 建议哪条业务线修复（最终归属由 triage 确定）
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
        - 不确定
    validations:
      required: true

  - type: input
    id: to_instance
    attributes:
      label: 指定实例（TO，可选）
      description: 想点名某个实例就填写；留空表示该业务线任意实例均可接手
      placeholder: runtime#kira
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 影响版本 / commit
      description: 例如 master@1a2b3c4，或使用的模型 ID
      placeholder: master@1a2b3c4
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小、确定性步骤；涉及命令请贴原文
      placeholder: |
        1. cargo run
        2. 输入 ...
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为与原始证据
      description: 原始输出摘要、错误信息、文件:行号、截图；先贴证据再给判断
      render: text
    validations:
      required: true

  - type: dropdown
    id: offline
    attributes:
      label: 是否可离线确定性复现
      options:
        - 是（无需真实模型）
        - 否（依赖真实模型 / 外部服务）
        - 未知
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 建议优先级
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true

  - type: textarea
    id: paths
    attributes:
      label: 相关路径与层
      description: 例如 src/frontend/tui/view.rs；runtime / 应用 / 前端
      placeholder: |
        src/...:
        层: runtime / 应用 / 前端
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 正文与证据中不含密钥、token 或 `.env` 内容
          required: true
        - label: 我已搜索现有 issue，未发现重复
          required: true
