name: Agent 任务交接
description: 独立业务线或主责之间的任务交接；主子内部派活使用 tmux
title: "[handoff] "
labels: ["handoff", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        > 新目标在 ready 前由 PM 补 Spec 固定评论/版本、AC、owner/路径/base；本模板只移交背景、状态和下一步。
        > 协作协议见根目录 `AGENTS.md` §8（交接、阻塞与升级）。
        > 主 agent 给自己的子 agent 派活或接收结果，使用 tmux；不使用本模板、不另认领或改标签。只写稳定实例 ID，不把 session／pane 数字当作后续路由。
        > 优先在**原 issue** 评论交接，只有目标确实不同才新开本 issue。
        > 新目标默认 `status:triage`：类型／归属／优先级由 PM 按目标补齐，DoR 完整后才置 `ready`。
        > 接收方以顶层 `KIND: ack` 回 `ACK`（交接通知评论 URL）、`SPEC`、`SCOPE`、`NEXT`，字段完整才算接收；发送方追踪到接收评论，超时由 `agent:pm` 兜底。`KIND: ack` 只表示接单，不等于设计批准；设计／契约结论用 `KIND: review`（APPROVE/REQUEST-CHANGES）或 `KIND: decision`，不得混用。

  - type: input
    id: source_issue
    attributes:
      label: 原 issue
      description: 引用交接来源及相关历史；不同目标应另写验收标准
      placeholder: "#42"
    validations:
      required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: 新任务的建议类型
      description: 按实际目标选择，分诊时核对；单纯换执行者应在原 issue 评论
      options:
        - type:bug
        - type:feature
        - type:test
        - type:refactor
        - type:docs
        - type:research
        - type:decision
        - type:question
    validations:
      required: true

  - type: dropdown
    id: from_agent
    attributes:
      label: 移交方业务线（FROM）
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
    validations:
      required: true

  - type: input
    id: from_instance
    attributes:
      label: 移交方实例 ID（FROM）
      description: 你的实例名，例如 runtime#kira
      placeholder: runtime#kira
    validations:
      required: true

  - type: dropdown
    id: to_agent
    attributes:
      label: 接收方业务线（TO）
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
    validations:
      required: true

  - type: input
    id: to_instance
    attributes:
      label: 接收方实例 ID（TO，可选）
      description: 不确定时留空，接收方确认时补充唯一实例 ID
      placeholder: tui#nova
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 背景与目标
      description: 为什么会有这个任务？最终要达成什么？
    validations:
      required: true

  - type: textarea
    id: state
    attributes:
      label: 当前状态
      description: 已完成什么、未完成什么、相关 commit / 分支
      placeholder: |
        已完成: ...
        未完成: ...
        分支/commit: agent/runtime/42-xxx @ 1a2b3c4
    validations:
      required: true

  - type: textarea
    id: next
    attributes:
      label: 下一步（具体动作）
      description: 接收方第一步应该做什么，越具体越好
    validations:
      required: true

  - type: textarea
    id: paths
    attributes:
      label: 涉及路径
      placeholder: |
        src/...:
        docs/...:
    validations:
      required: true

  - type: textarea
    id: pitfalls
    attributes:
      label: 已知坑与注意事项
      description: 踩过的坑、失败尝试、环境要求；没有就写「无」
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: 验收标准复述
      description: 写明本任务的可验证完成标准，并说明与来源任务的关系
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与阻塞
      description: 写入 Blocked-by / Blocks / 需要先完成的事项；没有就写「无」
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 交接清单
      options:
        - label: 已记录阶段成果、验证状态与 SHA；未提交推送时已说明原因和接手方式
          required: true
        - label: 新任务已注明来源 issue、目标与建议类型；单纯换执行者使用原 issue
          required: true
        - label: 目标业务线已知则改 `agent:*`；不确定时留给 `agent:pm` 分诊
          required: true
        - label: 接收方以 KIND ack 回 ACK/SPEC/SCOPE/NEXT 才完成接单；设计结论另走 review/decision，不混用
          required: true
        - label: 接收方确认接手后才移除 `handoff`；置 `ready` 前 DoR 完整
          required: true
        - label: 需沉淀的长期结论已写入 docs/ 或有明确 follow-up；无需沉淀时已说明
          required: true
