name: Feature 需求
description: 新能力或行为增强（type:feature）
title: "[feature] "
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        > 协作协议见根目录 `AGENTS.md`。创建时允许 Spec 版本/评论/base 暂空，不要伪造尚不存在的评论；PM 在 `triage`→`ready` 前补齐固定快照、R/AC、路径与依赖。`r1` 可作候选名称，不因默认名称跳过接收。

  - type: dropdown
    id: from_agent
    attributes:
      label: 提出方业务线（FROM）
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
        - 人类
    validations:
      required: true

  - type: input
    id: from_instance
    attributes:
      label: 提出方实例 ID（FROM）
      description: 业务线内的唯一实例名，例如 runtime#kira；人类填姓名
      placeholder: runtime#kira
    validations:
      required: true

  - type: dropdown
    id: to_agent
    attributes:
      label: 建议负责业务线（TO）
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
        - 不确定
    validations:
      required: true

  - type: input
    id: to_instance
    attributes:
      label: 指定实例（TO，可选）
      description: 想点名某个实例就填写；留空表示该业务线任意实例均可接手
      placeholder: runtime#kira
    validations:
      required: false

  - type: input
    id: spec_version
    attributes:
      label: Spec 版本（可暂空）
      description: PM 固定评论的精确版本；创建时可先写 r1 候选，PM 在 ready 前确认
      placeholder: r1
    validations:
      required: false

  - type: input
    id: spec_comment
    attributes:
      label: Spec 固定评论 URL（可暂空）
      description: 创建 issue 后通常才有评论 URL；PM 在 ready 前补当前顶层快照，后续实质变更升版本，不复用旧 ACK
      placeholder: https://github.com/HeimaoLST/Saki/issues/236#issuecomment-...
    validations:
      required: false

  - type: input
    id: base_ref
    attributes:
      label: base / 目标分支
      description: PM 登记 base（普通从 origin/dev）与最终目标；创建时可暂空，ready 前补齐；stacked 必须写直接依赖
      placeholder: origin/dev -> dev
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: 问题与用户价值
      description: 谁在什么场景遇到什么问题？不做会怎样？
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 可观察需求（R）
      description: 逐条编号 R1/R2，写用户可观察行为、失败边界与非目标；不写实现方案
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收 AC（可执行映射）
      description: 逐条编号 AC；每条写输入、步骤、预期、失败边界、证据方式与适用 owner
      placeholder: |
        - AC-01：给定 ...，当 ...，预期 ...；失败边界 ...；证据 ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 非目标
      description: 明确这次不做什么，防止 scope creep
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 涉及层
      options:
        - runtime（执行循环 / 模型 / 会话 / 协议）
        - 应用组装（app / profile / 预设）
        - 前端 TUI / console
        - 前端 GUI（desktop）
        - 文档
        - 跨层（新增跨业务线公共契约或不兼容变更先开 type:decision；局部维护按普通流程）
    validations:
      required: true

  - type: textarea
    id: paths
    attributes:
      label: 可写路径与交付物（可暂空）
      description: PM 在 ready 前补本 Spec 允许修改的路径、预期 PR/文档/测试产物；只读任务可写 N/A
      placeholder: |
        AGENTS.md, scripts/agent_notify.py
        scripts/test_agent_notify.py
    validations:
      required: false

  - type: checkboxes
    id: evidence
    attributes:
      label: 需要的证据类型
      options:
        - label: 确定性离线测试（禁止 sleep）
        - label: 真实模型运行摘要
        - label: PTY / 真实终端验证
        - label: 截图或交互对比
        - label: 文档同步

  - type: textarea
    id: deps
    attributes:
      label: 依赖与关联
      description: 写出 Blocked-by / Blocks / Refs，没有就写「无」
    validations:
      required: true
