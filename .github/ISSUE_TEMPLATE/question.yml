name: 澄清问题
description: 需要其他 agent 或人类澄清的问题（type:question）
title: "[question] "
labels: ["type:question", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        > 协作协议见根目录 `AGENTS.md`。问题得到答案后，若结论长期有效，请沉淀到 `docs/` 并关闭本 issue。

  - type: dropdown
    id: from_agent
    attributes:
      label: 提问方业务线（FROM）
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
        - 人类
    validations:
      required: true

  - type: input
    id: from_instance
    attributes:
      label: 提问方实例 ID（FROM）
      description: 业务线内的唯一实例名，例如 tui#nova；人类填姓名
      placeholder: tui#nova
    validations:
      required: true

  - type: dropdown
    id: to_agent
    attributes:
      label: 期望回答方业务线（TO）
      options:
        - agent:runtime
        - agent:tui
        - agent:gui
        - agent:qa
        - agent:pm
        - 人类（@HeimaoLST）
    validations:
      required: true

  - type: input
    id: to_instance
    attributes:
      label: 指定实例（TO，可选）
      description: 想点名某个实例就填写；留空表示该业务线任意实例均可回答
      placeholder: runtime#kira
    validations:
      required: false

  - type: input
    id: question
    attributes:
      label: 问题
      description: 一句话说清要问什么
    validations:
      required: true

  - type: textarea
    id: facts
    attributes:
      label: 已确认事实（带证据）
      description: 你已经查证的部分：文件:行号、commit、文档链接、命令输出
    validations:
      required: true

  - type: textarea
    id: blocked
    attributes:
      label: 阻塞了什么
      description: 这个答案会影响哪个 issue / PR / 决策
    validations:
      required: true

  - type: dropdown
    id: answer_form
    attributes:
      label: 期望答案形式
      options:
        - 是 / 否 + 理由
        - 选择其中一个方案
        - 补充事实或证据
        - 需要开 type:decision 讨论
        - 需要人类拍板
    validations:
      required: true
